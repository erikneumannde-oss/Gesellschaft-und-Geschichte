<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Willkommen – Wörter, Zahlen, Chemie und Puzzle</title>
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<style>
:root{--bg:#fff8ec;--ink:#22262e;--muted:#6a707c;--line:#e6dcc8;--ok:#2f9e44;--bad:#e03131;
 --c-w:#e8590c;--c-m:#1c7ed6;--c-c:#2f9e44;--c-p:#9c36b5;--der:#1c7ed6;--die:#e03131;--das:#2f9e44}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;min-height:100vh;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:3px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:1.15rem;flex:1;text-align:center}
.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:1rem;min-height:44px}
.stars{font-weight:800;font-size:1.05rem;min-width:76px;text-align:right}
main{max-width:980px;margin:0 auto;padding:16px 14px 40px}
.hello{text-align:center;margin:6px 0 18px}
.hello h2{margin:0;font-size:2rem}
.hello p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{border:0;border-radius:20px;color:#fff;padding:18px 14px;text-align:center;min-height:150px;box-shadow:0 5px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.card .ic{font-size:3rem;line-height:1}
.card b{font-size:1.3rem}
.card small{font-size:.9rem;opacity:.92}
.card.w{background:var(--c-w)}.card.m{background:var(--c-m)}.card.c{background:var(--c-c)}.card.p{background:var(--c-p)}
.mix{display:block;width:100%;margin-top:16px;border:0;border-radius:20px;padding:16px;font-size:1.25rem;font-weight:800;color:#fff;background:linear-gradient(90deg,#e8590c,#f59f00,#2f9e44,#1c7ed6,#9c36b5);box-shadow:0 5px 0 rgba(0,0,0,.2);min-height:64px}
.sec{margin:16px 0 8px;font-weight:800;color:var(--muted);font-size:.95rem;text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:600;min-height:44px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.act{background:#fff;border:3px solid var(--ac,var(--line));border-radius:18px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;min-height:84px}
.act .ic{font-size:2.4rem}
.act b{display:block;font-size:1.1rem}
.act small{color:var(--muted)}
.runhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.runhead .t{flex:1;font-weight:800}
.runhead .t small{display:block;font-weight:500;color:var(--muted)}
.box{background:#fff;border:3px solid var(--ac,var(--line));border-radius:22px;padding:18px 14px;min-height:320px}
.how{color:var(--muted);text-align:center;margin:0 0 12px;font-size:.95rem}
.bar{display:flex;gap:10px;justify-content:space-between;margin-top:14px}
.bar button{flex:1;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:1.05rem;min-height:56px}
.skip{background:#e9ecef}
.next{background:var(--ok);color:#fff;display:none}
.done .next{display:block}.done .skip{display:none}
.big{font-size:5.5rem;line-height:1.1;text-align:center}
.en{text-align:center;color:var(--muted);font-size:1.15rem}
.center{text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.opt{overflow-wrap:anywhere;hyphens:auto;border:3px solid var(--line);background:#fff;border-radius:16px;padding:12px;font-size:1.25rem;font-weight:700;min-height:66px}
.opt.emo{font-size:3.2rem;line-height:1.1}
.opt.ok{background:#d3f9d8;border-color:var(--ok)}
.opt.bad{background:#ffe3e3;border-color:var(--bad);opacity:.7}
.opt:disabled{cursor:default}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pop{animation:pp .5s}
@keyframes pp{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.art{font-weight:800;border-radius:8px;padding:0 7px;color:#fff}
.art.der{background:var(--der)}.art.die{background:var(--die)}.art.das{background:var(--das)}
.msg{min-height:1.6em;text-align:center;font-weight:700;margin-top:10px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.flash{display:block;margin:0 auto;width:min(100%,420px);min-height:260px;border:4px dashed var(--c-w);background:#fffdf7;border-radius:24px;padding:20px}
.flash .w{font-size:2.2rem;font-weight:800}
.spk{border:2px solid var(--line);background:#fff;border-radius:999px;min-width:48px;min-height:48px;font-size:1.4rem}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:62px;padding:8px;border:3px dashed var(--line);border-radius:16px;margin:12px 0}
.tile{border:3px solid var(--ac,var(--c-p));background:#fff;border-radius:12px;min-width:48px;min-height:52px;padding:6px 12px;font-size:1.35rem;font-weight:800}
.tile.used{visibility:hidden}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.small-btns{display:flex;gap:8px;justify-content:center;margin-top:10px}
.small-btns button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-weight:700;min-height:46px}
.eq{font-size:2.6rem;font-weight:800;text-align:center;margin:6px 0}
.eqw{text-align:center;color:var(--muted);font-size:1.05rem;margin-bottom:8px}
.dots{text-align:center;font-size:1.6rem;margin-bottom:6px;word-break:break-all}
.disp{font-size:2.4rem;font-weight:800;text-align:center;border:3px solid var(--ink);border-radius:14px;min-height:64px;max-width:240px;margin:8px auto;padding:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto}
.pad button{border:3px solid var(--line);background:#fff;border-radius:14px;font-size:1.6rem;font-weight:800;min-height:58px}
.pad .go{background:var(--ok);color:#fff;border-color:var(--ok)}
.story{font-size:1.2rem;text-align:center;margin:4px 0}
.story small{display:block;color:var(--muted);font-size:1rem;margin-top:4px}
.pyr{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px 0}
.pyr .row{display:flex;gap:8px}
.pyr input,.pyr .fix{width:74px;height:58px;text-align:center;font-size:1.5rem;font-weight:800;border:3px solid var(--line);border-radius:12px;background:#fff}
.pyr .fix{display:flex;align-items:center;justify-content:center;background:#fff3bf;border-color:#f59f00}
.pyr input.ok{background:#d3f9d8;border-color:var(--ok)}
.pyr input.bad{background:#ffe3e3;border-color:var(--bad)}
.seq{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:2rem;font-weight:800;margin:10px 0}
.seq span{border:3px solid var(--line);border-radius:12px;padding:6px 12px;min-width:56px;text-align:center;background:#fff}
.seq span.q{border-color:var(--c-m);color:var(--c-m)}
.sym{font-size:4.2rem;font-weight:900;text-align:center;line-height:1.1}
.atom{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;font-weight:800;font-size:1.05rem;color:#fff;border:2px solid rgba(0,0,0,.25);flex:none}
.stepper{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px 0}
.stepper .n{font-size:1.7rem;font-weight:800;min-width:44px;text-align:center}
.stepper button{width:52px;height:52px;border-radius:14px;border:3px solid var(--line);background:#fff;font-size:1.7rem;font-weight:800}
.formula{font-size:2.6rem;font-weight:800;text-align:center;min-height:3.4rem}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:640px;margin:0 auto}
.mc{overflow-wrap:anywhere;hyphens:auto;border:3px solid var(--c-p);background:var(--c-p);color:#fff;border-radius:14px;min-height:96px;font-size:2.2rem;display:flex;align-items:center;justify-content:center;padding:4px;text-align:center;font-weight:800;line-height:1.1}
.mc.up{background:#fff;color:var(--ink);font-size:1.15rem}
.mc.up.e{font-size:2.6rem}
.mc.got{background:#d3f9d8;border-color:var(--ok);color:var(--ink);font-size:1.1rem}
.mc.got.e{font-size:2.6rem}
@media(max-width:520px){.mem{grid-template-columns:repeat(3,1fr)}}
.sl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(100%,330px);margin:10px auto}
.sl button{aspect-ratio:1;border:0;border-radius:14px;font-size:2.4rem;font-weight:900;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.sl button.empty{visibility:hidden}
.ws{display:grid;gap:3px;width:min(100%,520px);margin:10px auto;user-select:none;-webkit-user-select:none}
.ws button{aspect-ratio:1;border:2px solid var(--line);background:#fff;border-radius:8px;font-weight:800;font-size:1.15rem;padding:0}
.ws button.st{background:#ffe066;border-color:#f59f00}
.ws button.fd{background:#b2f2bb;border-color:var(--ok)}
.wl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wl span{background:#f1f3f5;border-radius:12px;padding:6px 12px;font-weight:700}
.wl span.fd{background:#d3f9d8;color:#1b6b2c}
.sd{display:grid;grid-template-columns:repeat(4,1fr);width:min(100%,300px);margin:10px auto;border:4px solid var(--ink)}
.sd button{aspect-ratio:1;border:1px solid #adb5bd;background:#fff;font-size:1.9rem;font-weight:800;padding:0}
/* Sudoku-Linien per Skript */
.sd button.g{background:#fff3bf}
.sd button.sel{background:#a5d8ff}
.sd button.bad{background:#ffc9c9}
.foot{text-align:center;margin:10px 0 28px;font-size:.85rem}
.foot a{color:var(--muted)}
@media print{.top,.bar,.foot{display:none}}
</style>
</head>

function runner(list,title,en,hex){
  let last=null,ctx,done;
  const t=h('div',{class:'t'}),box=h('div',{class:'box',style:'--ac:'+hex}),bar=h('div',{class:'bar'});
  const skip=h('button',{class:'skip',onclick:next},'⏭ Überspringen · Skip'),nx=h('button',{class:'next',onclick:next},'Weiter · Next ▶');
  bar.append(skip,nx);
  const wrap=h('div',null,h('div',{class:'runhead'},h('button',{class:'pill',onclick:()=>{const a=list.length===1||list.every(i=>TASKS[i].area===TASKS[list[0]].area)?TASKS[list[0]].area:null;a?areaPage(a):home();}},'←'),t),box,bar);
  app.replaceChildren(wrap);
  function next(){
    let id;do{id=pick(list);}while(list.length>1&&id===last);last=id;done=false;wrap.classList.remove('done');
    const T=TASKS[id];t.replaceChildren(T.icon+' '+T.title,h('small',null,T.en));box.replaceChildren();
    ctx={level:state.level,theme:state.theme,solved(){if(done)return;done=true;state.stars++;updateStars();wrap.classList.add('done');}};

}

/* Auswahl: options = Liste, ok = Index der richtigen, view(o) = Inhalt */
function choice(box,options,ok,ctx,view,cls,onok){
  const say=msg(box),wrap=h('div',{class:'opts'});box.insertBefore(wrap,box.lastChild);
  options.forEach((o,i)=>{const b=h('button',{class:'opt '+(cls||'')},view(o));b.onclick=()=>{
    if(i===ok){wrap.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add('ok','pop');say('✔ Richtig! · Correct!','ok');if(onok)onok();ctx.solved();}
    else{b.classList.add('bad','shake');b.disabled=true;say('Versuche es nochmal. · Try again.','bad');}};wrap.append(b);});

function memory(box,pairs,ctx){
  how(box,'Finde die Paare.','Find the pairs.');
  const cards=shuffle(pairs.flatMap(p=>[{k:p.k,c:p.a,e:p.ae},{k:p.k,c:p.b,e:p.be}]));
  const g=h('div',{class:'mem'});box.append(g);let open=[],lock=false,left=pairs.length;
  cards.forEach(cd=>{const b=h('button',{class:'mc'},'?');b.onclick=()=>{
    if(lock||b.classList.contains('up')||b.classList.contains('got'))return;
    b.className='mc up'+(cd.e?' e':'');b.innerHTML=cd.c;open.push([b,cd]);
    if(open.length===2){const[[b1,c1],[b2,c2]]=open;
      if(c1.k===c2.k){b1.className=b2.className='mc got'+(c1.e?' e':'');b1.classList.add('pop');b2.classList.add('pop');open=[];if(--left===0){msg(box)('🎉 Alle Paare gefunden! · All pairs found!','ok');ctx.solved();}}
      else{lock=true;setTimeout(()=>{[b1,b2].forEach(x=>{x.className='mc';x.textContent='?';});open=[];lock=false;},1100);}}};g.append(b);});
}

function sdCount(g,lim){const i=g.indexOf(0);if(i<0)return 1;const r=Math.floor(i/4),c=i%4;let n=0;
  for(let v=1;v<=4&&n<lim;v++){let bad=false;for(let k=0;k<4;k++){if(g[r*4+k]===v||g[k*4+c]===v){bad=true;break;}}
    if(!bad){const br=r-r%2,bc=c-c%2;for(let a=0;a<2&&!bad;a++)for(let b=0;b<2;b++)if(g[(br+a)*4+bc+b]===v){bad=true;break;}}
    if(!bad){g[i]=v;n+=sdCount(g,lim-n);g[i]=0;}}return n;}
function sdMake(keep){
  const base=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]],dm=shuffle([1,2,3,4]);let g=base.map(r=>r.map(v=>dm[v-1]));
  const mk=()=>{const b=shuffle([0,1]),x=shuffle([0,1]),y=shuffle([0,1]);return[b[0]*2+x[0],b[0]*2+x[1],b[1]*2+y[0],b[1]*2+y[1]];};
  const ro=mk(),co=mk();g=ro.map(i=>co.map(j=>g[i][j]));const sol=g.flat(),pz=sol.slice();let gv=16;
  for(const i of shuffle([...Array(16).keys()])){if(gv<=keep)break;const t=pz[i];pz[i]=0;if(sdCount(pz.slice(),2)!==1)pz[i]=t;else gv--;}
  return{sol,pz};
}
