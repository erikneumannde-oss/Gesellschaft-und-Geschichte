<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Der Euro – Soll Novarien beitreten?</title>
<style>
:root{--blue:#0b2f7a;--blue2:#17469f;--gold:#f2c230;--gold2:#c99a0a;--ink:#1d2433;--paper:#ffffff;--soft:#eef3fc;--ok:#1f8a4c;--bad:#b3261e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;position:relative;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:#0b3a9e;min-height:100vh;line-height:1.55}
.euflag{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:14px 14px 70px}
header.top{display:flex;align-items:center;gap:12px;color:#fff;padding:6px 2px 10px;flex-wrap:wrap}
.coin{width:46px;height:46px;flex:none}
header.top h1{margin:0;font-size:1.3rem;line-height:1.2}
header.top small{display:block;color:#cfdcf7;font-weight:400;font-size:.8rem}
#rolebadge{margin-left:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 14px;font-size:.9rem}
nav#tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
nav#tabs button{flex:none;border:2px solid rgba(255,255,255,.45);background:rgba(8,30,90,.78);color:#fff;border-radius:12px;padding:8px 12px;font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap}
nav#tabs button.act{background:var(--gold);color:#241a00;border-color:var(--gold);font-weight:700}
nav#tabs button .ck{display:none;margin-left:4px;color:#7ee2a0}
nav#tabs button.act .ck{color:#1c6b3b}
nav#tabs button.done .ck{display:inline}
nav#tabs button:disabled{opacity:.45;cursor:default}
main{background:var(--paper);border-radius:16px;padding:20px 22px 26px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
h2{margin:0 0 4px;color:var(--blue);font-size:1.5rem}
.sub{color:#51607c;margin:0 0 14px}
h3{color:var(--blue2);margin:22px 0 6px;font-size:1.1rem}
p{margin:0 0 10px}
.box{background:var(--soft);border-left:5px solid var(--blue2);border-radius:8px;padding:10px 14px;margin:12px 0}
.box.gold{background:#fff7da;border-left-color:var(--gold2)}
.task{border:2px solid #d4def2;border-radius:12px;padding:12px 14px;margin:14px 0;background:#fcfdff}
.task.ok{border-color:#9bd5b2;background:#f4fbf7}
.task .q{font-weight:600;margin-bottom:8px}
.task .nr{display:inline-block;background:var(--blue2);color:#fff;border-radius:999px;min-width:26px;height:26px;text-align:center;line-height:26px;font-size:.85rem;margin-right:6px}
textarea{width:100%;min-height:92px;border:1.5px solid #b9c7e6;border-radius:8px;padding:9px 11px;font:inherit;resize:vertical;background:#fff;color:var(--ink)}
input[type=text]{border:1.5px solid #b9c7e6;border-radius:8px;padding:7px 10px;font:inherit;width:120px;background:#fff;color:var(--ink)}
.btn{border:none;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--blue2);color:#fff}
.btn.gold{background:var(--gold);color:#241a00}
.btn.ghost{background:#e4ebf8;color:var(--blue)}
.btn:disabled{opacity:.5}
.fb{margin-top:8px;font-weight:600;min-height:1.2em}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.ordrow{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #c7d3ee;border-radius:9px;padding:7px 10px;margin:6px 0}
.ordrow .t{flex:1}
.ordrow button{border:1px solid #9fb2dc;background:#eef3fc;border-radius:7px;width:34px;height:34px;cursor:pointer;font-size:1rem}
.ordrow.good{border-color:#6fc593;background:#effaf3}
.ordrow.wrong{border-color:#e0928c;background:#fff3f2}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:12px 0}
.role{border:2px solid #c7d3ee;border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit}
.role:hover{border-color:var(--blue2)}
.role.sel{border-color:var(--gold2);background:#fff7da;box-shadow:0 0 0 3px rgba(242,194,48,.45)}
.role b{display:block;color:var(--blue)}
.role .ic{font-size:1.8rem;display:block}
.role small{display:block;color:#51607c;margin-top:4px}
table.crit{width:100%;border-collapse:collapse;margin:8px 0;font-size:.95rem}
table.crit th,table.crit td{border:1px solid #cdd8ef;padding:7px 8px;text-align:left;vertical-align:top}
table.crit th{background:#e9effb;color:var(--blue)}
table.crit tr.good td{background:#effaf3}
table.crit tr.wrong td{background:#fff3f2}
select{font:inherit;border:1.5px solid #b9c7e6;border-radius:8px;padding:6px;background:#fff}
.sortcard{display:flex;gap:10px;align-items:center;border:1.5px solid #c7d3ee;border-radius:9px;padding:8px 10px;margin:6px 0;background:#fff}
.sortcard .t{flex:1}
.sortcard .sw{display:flex;gap:5px;flex:none}
.sortcard .sw button{border:1.5px solid #9fb2dc;background:#eef3fc;border-radius:8px;padding:6px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.sortcard .sw button.on.v{background:#d9f3e3;border-color:#6fc593;font-weight:700}
.sortcard .sw button.on.n{background:#fde0dd;border-color:#e0928c;font-weight:700}
.sortcard.good{border-color:#6fc593}.sortcard.wrong{border-color:#e0928c;background:#fff3f2}
.choices{display:flex;flex-direction:column;gap:7px}
.choices button{text-align:left;border:1.5px solid #b9c7e6;background:#fff;border-radius:9px;padding:8px 12px;font:inherit;cursor:pointer}
.choices button.on{background:#e6eefc;border-color:var(--blue2)}
.choices button.right{background:#d9f3e3;border-color:#6fc593}
.choices button.wrongc{background:#fde0dd;border-color:#e0928c}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.toplinks{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.toplinks a{background:rgba(0,0,0,.35);color:#fff;text-decoration:none;border-radius:8px;padding:5px 11px;font-size:.85rem}
.note{font-size:.84rem;color:#51607c;margin-top:18px}
.resetlink{background:none;border:none;padding:0;font:inherit;color:#51607c;text-decoration:underline;cursor:pointer}
.imp{position:fixed;right:10px;bottom:10px;font-size:12px;color:#333;background:rgba(255,255,255,.92);padding:4px 8px;border-radius:4px;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.vote{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.vote button{border:2px solid #b9c7e6;background:#fff;border-radius:12px;padding:14px 10px;font:inherit;font-weight:700;cursor:pointer;color:var(--blue)}
.vote button.on{border-color:var(--gold2);background:#fff7da;box-shadow:0 0 0 3px rgba(242,194,48,.45)}
.mine{background:#f6f8fd;border:1px dashed #9fb2dc;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.92rem;white-space:pre-wrap}

.land{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:linear-gradient(135deg,#eaf4f6,#f7f1dc);border:2px solid #b7d3d8;border-radius:14px;padding:14px 16px;margin:14px 0}
.land .emb{display:flex;gap:12px;align-items:flex-end}
.land .emb svg{display:block}
.land h3{margin:0 0 4px;color:#0d6a73}
.land ul{margin:6px 0 0;padding-left:18px;font-size:.93rem}
.mp{display:flex;gap:12px;align-items:flex-start;margin:6px 0 16px}
.mp img{flex:none;width:72px;height:72px;border-radius:50%;border:3px solid #0d7c86;object-fit:cover}
.mp .sp{position:relative;background:#e9f6f7;border:2px solid #9fcdd3;border-radius:12px;padding:8px 12px;font-style:italic;color:#14424a}
.mp .sp small{display:block;font-style:normal;font-weight:700;color:#0d6a73;font-size:.78rem;margin-bottom:2px}
.help{background:#f3f7ff;border:1.5px dashed #8fa9dc;border-radius:10px;padding:8px 12px;margin:10px 0}
.help summary{cursor:pointer;font-weight:700;color:var(--blue2)}
.help p,.help ul{margin:6px 0 2px}
.matchrow{display:flex;gap:10px;align-items:center;border:1.5px solid #c7d3ee;border-radius:9px;padding:8px 10px;margin:6px 0;background:#fff;flex-wrap:wrap}
.matchrow .t{flex:1;min-width:220px}
.matchrow.good{border-color:#6fc593;background:#effaf3}.matchrow.wrong{border-color:#e0928c;background:#fff3f2}
@media(max-width:640px){.land{grid-template-columns:1fr}}

.rolefab{position:fixed;left:12px;bottom:12px;z-index:50;border:none;border-radius:999px;background:var(--gold);color:#241a00;font:inherit;font-weight:700;padding:10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.4);cursor:pointer;display:none}
.rolefab.show{display:inline-flex;gap:6px;align-items:center}
#rolebadge{cursor:pointer;font:inherit;font-size:.9rem}
.modal{position:fixed;inset:0;background:rgba(5,15,50,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .card{background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.5);text-align:center}
.modal .card .big{font-size:3rem;line-height:1}
.modal .card h3{margin:6px 0 8px;color:var(--blue);font-size:1.3rem}
.modal .card p{text-align:left}
.modal .card .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
@media(max-width:640px){main{padding:16px 14px 22px}.sortcard{flex-direction:column;align-items:stretch}.sortcard .sw{justify-content:flex-start}}
</style>

<script>
/* ===== Speicher (localStorage, mit Ersatz im Arbeitsspeicher) ===== */
const mem={};
const store={
  get(k){try{const v=localStorage.getItem(k);return v===null?(mem[k]??null):v;}catch(e){return mem[k]??null;}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,v);}catch(e){}},
  clearAll(){Object.keys(mem).forEach(k=>delete mem[k]);try{Object.keys(localStorage).filter(k=>k.startsWith('eu_')).forEach(k=>localStorage.removeItem(k));}catch(e){}}
};
function resetBtn(){
  const p=document.createElement('p');p.className='note';
  const b=document.createElement('button');b.type='button';b.className='resetlink';b.textContent='Gespeicherte Eingaben auf diesem Gerät löschen';
  b.onclick=()=>{if(confirm('Alle gespeicherten Antworten, die Rolle und den Fortschritt auf diesem Gerät löschen?')){store.clearAll();location.reload();}};
  p.appendChild(b);return p;
}

/* ===== Aufgaben-Bausteine ===== */
function mkTyped(key,label,min,ph){
  const wrap=document.createElement('div');
  const ta=document.createElement('textarea');ta.placeholder=ph||'Deine Antwort …';
  ta.value=store.get('eu_ans_'+key)||'';
  const upd=()=>{store.set('eu_ans_'+key,ta.value);wrap.dispatchEvent(new Event('state',{bubbles:true}));};
  ta.addEventListener('input',upd);
  wrap.appendChild(ta);
  wrap.isDone=()=>ta.value.trim().length>=min;
  return wrap;
}
function mkOrder(key,items,start){
  const wrap=document.createElement('div');
  let order=null;try{order=JSON.parse(store.get('eu_ord_'+key)||'null');}catch(e){}
  if(!order||order.length!==items.length)order=start.slice();
  const list=document.createElement('div');
  const fb=document.createElement('div');fb.className='fb';
  const chk=document.createElement('button');chk.className='btn';chk.textContent='Reihenfolge prüfen';
  let solved=store.get('eu_solved_'+key)==='1';
  function draw(marks){
    list.innerHTML='';
    order.forEach((idx,pos)=>{
      const r=document.createElement('div');r.className='ordrow'+(marks?(idx===pos?' good':' wrong'):'');
      r.innerHTML='<span class="t">'+items[idx]+'</span>';
      const up=document.createElement('button');up.textContent='▲';up.setAttribute('aria-label','nach oben');
      const dn=document.createElement('button');dn.textContent='▼';dn.setAttribute('aria-label','nach unten');
      up.onclick=()=>{if(pos>0){[order[pos-1],order[pos]]=[order[pos],order[pos-1]];save();draw();}};
      dn.onclick=()=>{if(pos<order.length-1){[order[pos+1],order[pos]]=[order[pos],order[pos+1]];save();draw();}};
      r.appendChild(up);r.appendChild(dn);list.appendChild(r);
    });
  }
  function save(){store.set('eu_ord_'+key,JSON.stringify(order));fb.textContent='';fb.className='fb';solved=false;store.set('eu_solved_'+key,'0');wrap.dispatchEvent(new Event('state',{bubbles:true}));}
  chk.onclick=()=>{
    const right=order.filter((idx,pos)=>idx===pos).length;
    draw(true);
    if(right===order.length){fb.textContent='✓ Richtig. Die Reihenfolge stimmt.';fb.className='fb ok';solved=true;store.set('eu_solved_'+key,'1');}
    else{fb.textContent=right+' von '+order.length+' Karten stehen an der richtigen Stelle.';fb.className='fb bad';solved=false;store.set('eu_solved_'+key,'0');}
    wrap.dispatchEvent(new Event('state',{bubbles:true}));

function mkSort(key,cards){
  const wrap=document.createElement('div');
  let st={};try{st=JSON.parse(store.get('eu_sort_'+key)||'{}');}catch(e){}
  const list=document.createElement('div');
  const fb=document.createElement('div');fb.className='fb';
  const chk=document.createElement('button');chk.className='btn';chk.textContent='Zuordnung prüfen';
  let solved=store.get('eu_solved_'+key)==='1';
  function draw(marks){
    list.innerHTML='';
    cards.forEach((c,i)=>{
      const d=document.createElement('div');
      const cur=st[i];
      d.className='sortcard'+(marks&&cur?(cur===c.a?' good':' wrong'):'');
      d.innerHTML='<span class="t">'+c.t+'</span>';
      const sw=document.createElement('span');sw.className='sw';
      [['v','Vorteil'],['n','Nachteil']].forEach(([k,l])=>{
        const b=document.createElement('button');b.textContent=l;b.className=(cur===k?'on ':'')+k;
        b.onclick=()=>{st[i]=k;store.set('eu_sort_'+key,JSON.stringify(st));solved=false;store.set('eu_solved_'+key,'0');fb.textContent='';fb.className='fb';draw();wrap.dispatchEvent(new Event('state',{bubbles:true}));};
        sw.appendChild(b);
      });
      d.appendChild(sw);list.appendChild(d);
    });
  }
  chk.onclick=()=>{
    const set=Object.keys(st).length;
    if(set<cards.length){fb.textContent='Ordne zuerst alle Karten zu.';fb.className='fb bad';return;}
    const right=cards.filter((c,i)=>st[i]===c.a).length;
    draw(true);
    if(right===cards.length){fb.textContent='✓ Alles richtig zugeordnet.';fb.className='fb ok';solved=true;store.set('eu_solved_'+key,'1');}
    else{fb.textContent=right+' von '+cards.length+' Karten sind richtig zugeordnet. Prüfe die rot markierten noch einmal.';fb.className='fb bad';solved=false;store.set('eu_solved_'+key,'0');}
    wrap.dispatchEvent(new Event('state',{bubbles:true}));
  };
  draw(solved);
  if(solved){fb.textContent='✓ Alles richtig zugeordnet.';fb.className='fb ok';}
  wrap.append(list,chk,fb);
  wrap.isDone=()=>solved;
  return wrap;
}
function mkNum(key,tol,okmsg,badmsg,unit){

  const fb=document.createElement('div');fb.className='fb';
  let solved=store.get('eu_solved_'+key)==='1';
  if(solved){fb.textContent='✓ '+okmsg;fb.className='fb ok';}
  b.onclick=()=>{
    store.set('eu_ans_'+key,inp.value);
    const v=num(inp.value);
    if(!isNaN(v)&&Math.abs(v-tol.v)<=tol.d){fb.textContent='✓ '+okmsg;fb.className='fb ok';solved=true;store.set('eu_solved_'+key,'1');}
    else{fb.textContent=badmsg;fb.className='fb bad';solved=false;store.set('eu_solved_'+key,'0');}
    wrap.dispatchEvent(new Event('state',{bubbles:true}));
  };
  inp.addEventListener('input',()=>{solved=false;store.set('eu_solved_'+key,'0');fb.textContent='';fb.className='fb';wrap.dispatchEvent(new Event('state',{bubbles:true}));});
  wrap.append(inp,u,b,fb);
  wrap.isDone=()=>solved;

}
function mkChoice(key,opts,right,okmsg,badmsg){
  const wrap=document.createElement('div');
  const box=document.createElement('div');box.className='choices';
  const fb=document.createElement('div');fb.className='fb';
  let sel=store.get('eu_ans_'+key);sel=sel===null?null:parseInt(sel,10);
  let solved=store.get('eu_solved_'+key)==='1';
  function draw(){
    box.innerHTML='';
    opts.forEach((o,i)=>{
      const b=document.createElement('button');b.textContent=o;
      if(sel===i){b.className=solved?(i===right?'right':'on'):'on';}
      b.onclick=()=>{
        sel=i;store.set('eu_ans_'+key,String(i));
        if(i===right){solved=true;store.set('eu_solved_'+key,'1');fb.textContent='✓ '+okmsg;fb.className='fb ok';}

  if(solved){fb.textContent='✓ '+okmsg;fb.className='fb ok';}
  wrap.append(box,fb);
  wrap.isDone=()=>solved;

function mkCrit(){
  const wrap=document.createElement('div');
  const rows=[
    {k:'preis',n:'Preisstabilität',d:'Inflationsrate in Novarien: <b>3,3 %</b>.<br>Die drei preisstabilsten EU-Länder haben: 1,2 % · 1,4 % · 1,6 %.<br>Erlaubt: höchstens <b>1,5 Prozentpunkte</b> über deren Durchschnitt.',calc:[{id:'a',l:'Durchschnitt der drei Länder',v:1.4},{id:'b',l:'Erlaubter Höchstwert',v:2.9}],ok:false},
    {k:'defizit',n:'Neuverschuldung des Staates',d:'Novarien macht neue Schulden von <b>2,6 %</b> der Wirtschaftsleistung (BIP).<br>Erlaubt: höchstens 3 %.',ok:true},
    {k:'schuld',n:'Gesamtschuldenstand',d:'Die Staatsschulden Novariens betragen <b>71 %</b> des BIP.<br>Erlaubt: höchstens 60 % (oder deutlich sinkend, was hier nicht der Fall ist).',ok:false},
    {k:'wk',n:'Wechselkursstabilität',d:'Der Novar hat <b>zwei Jahre lang</b> am Wechselkursmechanismus II teilgenommen und blieb dabei stabil.<br>Verlangt: mindestens zwei Jahre ohne starke Schwankungen.',ok:true},
    {k:'zins',n:'Langfristige Zinsen',d:'Novarien zahlt für langfristige Staatsanleihen <b>4,1 %</b>.<br>Die drei preisstabilsten Länder zahlen: 2,8 % · 3,0 % · 3,2 %.<br>Erlaubt: höchstens <b>2 Prozentpunkte</b> über deren Durchschnitt.',calc:[{id:'a',l:'Durchschnitt der drei Länder',v:3.0},{id:'b',l:'Erlaubter Höchstwert',v:5.0}],ok:true}
  ];
  let st={};try{st=JSON.parse(store.get('eu_crit')||'{}');}catch(e){}
  const tbl=document.createElement('table');tbl.className='crit';
  tbl.innerHTML='<tr><th>Kriterium</th><th>Daten Novariens</th><th>Dein Urteil</th></tr>';
  const fb=document.createElement('div');fb.className='fb';
  let solved=store.get('eu_solved_crit')==='1';
  function save(){store.set('eu_crit',JSON.stringify(st));solved=false;store.set('eu_solved_crit','0');fb.textContent='';fb.className='fb';tbl.querySelectorAll('tr.good,tr.wrong').forEach(r=>r.className='');wrap.dispatchEvent(new Event('state',{bubbles:true}));}
  rows.forEach(r=>{
    const tr=document.createElement('tr');tr.dataset.k=r.k;
    const td1=document.createElement('td');td1.innerHTML='<b>'+r.n+'</b>';
    const td2=document.createElement('td');td2.innerHTML=r.d;
    if(r.calc){
      r.calc.forEach(c=>{
        const p=document.createElement('div');p.style.marginTop='6px';
        p.innerHTML=c.l+': ';
        const i=document.createElement('input');i.type='text';i.inputMode='decimal';i.style.width='70px';i.value=st[r.k+'_'+c.id]||'';
        i.addEventListener('input',()=>{st[r.k+'_'+c.id]=i.value;save();});
        p.appendChild(i);p.appendChild(document.createTextNode(' %'));td2.appendChild(p);
      });
    }
    const td3=document.createElement('td');
    const sel=document.createElement('select');
    sel.innerHTML='<option value="">– wählen –</option><option value="y">erfüllt</option><option value="n">nicht erfüllt</option>';
    sel.value=st[r.k]||'';
    sel.addEventListener('change',()=>{st[r.k]=sel.value;save();});
    td3.appendChild(sel);
    tr.append(td1,td2,td3);tbl.appendChild(tr);
  });
  const chk=document.createElement('button');chk.className='btn';chk.textContent='Prüfen';
  chk.onclick=()=>{
    let all=true,right=0;
    rows.forEach(r=>{
      const tr=tbl.querySelector('tr[data-k="'+r.k+'"]');
      let good=(st[r.k]===(r.ok?'y':'n'));
      if(r.calc){r.calc.forEach(c=>{const v=num(st[r.k+'_'+c.id]||'');if(isNaN(v)||Math.abs(v-c.v)>0.051)good=false;});}
      tr.className=good?'good':'wrong';
      if(good)right++;else all=false;
    });
    if(all){fb.textContent='✓ Alles richtig.';fb.className='fb ok';solved=true;store.set('eu_solved_crit','1');}
    else{fb.textContent=right+' von '+rows.length+' Kriterien sind vollständig richtig. Rechne und prüfe die rot markierten noch einmal.';fb.className='fb bad';solved=false;store.set('eu_solved_crit','0');}
    wrap.dispatchEvent(new Event('state',{bubbles:true}));
  };
  wrap.append(tbl,chk,fb);
  if(solved){tbl.querySelectorAll('tr[data-k]').forEach(t=>t.className='good');fb.textContent='✓ Alles richtig.';fb.className='fb ok';}
  wrap.isDone=()=>solved;
  return wrap;
}

   {q:'Am Devisenmarkt entspricht 1 € genau 1,10 US-$. Wie viele Euro kostet dann 1 US-$ (auf zwei Stellen gerundet)?',w:()=>mkNum('wert_1',{v:0.91,d:0.011},'Richtig: 1 US-$ entspricht etwa 0,91 €.','Noch nicht. Rechne 1 ÷ 1,10.','€')},

   {q:'Was bedeutet der höhere Eurokurs für den Verkauf des Autos in den USA?',w:()=>mkChoice('wert_3',['Das Auto wird für US-Käufer billiger, der Absatz steigt.','Das Auto wird für US-Käufer teurer, der Absatz kann sinken.','Es ändert sich nichts.'],1,'Richtig. Ein starker Euro verteuert Exporte.','Überlege, wie sich der Preis in US-$ verändert hat.')},
   {q:'Wann spricht man von Kaufkraftparität?',w:()=>mkChoice('wert_4',['Wenn alle Länder dieselbe Währung haben.','Wenn Binnenwert und Außenwert einer Währung übereinstimmen.','Wenn der Wechselkurs jeden Tag gleich bleibt.'],1,'Richtig.','Lies die Definition oben noch einmal.')},
   {q:'Erkläre mit einem eigenen Beispiel, warum Binnenwert und Außenwert einer Währung auseinanderfallen können.',w:()=>mkTyped('wert_5','',40)}
  ]},
 krise:{
  mp:'Ich habe die Proteste in Griechenland gesehen. Ich will verstehen, wie es dazu kommen konnte.',
  title:'Station 5 – Die Eurokrise: Wenn es schiefgeht',
  sub:'Eine Zerreißprobe für die Währungsunion',
  text:`<p>Ab 2007 erschütterte die weltweite Finanzkrise die Banken. Viele Staaten retteten Banken mit Steuergeld und stützten die Wirtschaft, ihre Schulden stiegen stark. Ende 2009 zeigte sich, dass Griechenlands Schulden und Defizit deutlich höher waren als gemeldet. Anleger verloren das Vertrauen: Sie verlangten für Kredite an Griechenland immer höhere Zinsen, und das Land konnte sich kaum noch Geld leihen.</p>
  <p>Im Mai 2010 sagten die anderen Euro-Länder und der Internationale Währungsfonds (IWF) Griechenland Kredite zu, verlangten dafür aber strenge Sparauflagen. Später erhielten auch Irland, Portugal, Spanien (für seine Banken) und Zypern Hilfe. Zur Absicherung entstanden Rettungsschirme, aus denen ab 2012 der dauerhafte Euro-Rettungsschirm ESM wurde. Im Sommer 2012 kündigte der EZB-Präsident Mario Draghi an, die EZB werde alles Nötige tun, um den Euro zu erhalten. Danach beruhigten sich die Märkte. In Griechenland blieben die Folgen: Die Wirtschaft schrumpfte, die Arbeitslosigkeit stieg stark, es gab Proteste. Das letzte Hilfsprogramm endete im August 2018.</p>`,
  tasks:[
   {q:'Bringe den Ablauf der Krise in die richtige Reihenfolge.',w:()=>mkOrder('krise',[
     'Die Finanzkrise bringt Banken in Not, Staaten retten sie und häufen Schulden an.',
     'Anleger misstrauen Griechenland und verlangen hohe Zinsen auf seine Staatsanleihen.',
     'Griechenland kann sich kaum noch Geld leihen und braucht Hilfe.',
     'Euro-Länder und IWF geben Kredite, verlangen aber Sparauflagen.',
     'Die EZB kündigt an, alles Nötige für den Erhalt des Euro zu tun. Die Märkte beruhigen sich.'],[3,0,4,2,1])},
   {q:'Griechenland konnte als Euro-Land seine Währung nicht abwerten. Erkläre, warum das in der Krise ein Problem war (siehe Station 3).',w:()=>mkTyped('krise_2','',40)},
   {q:()=>'Die Hilfen gab es nur gegen Sparauflagen. Beurteile aus Sicht von '+roleName()+', ob das gerecht war.',w:()=>mkTyped('krise_3','',40,'Aus meiner Rolle sehe ich das so, weil …'),roleKey:true},
   {q:'Was bedeutet die Eurokrise für die Frage, ob Novarien den Euro einführen sollte? Nenne ein Argument dafür, ein Argument dagegen.',w:()=>mkTyped('krise_4','',50)}
  ]}
};

/* ===== Rendering ===== */
let cur=store.get('eu_station')||'start';
function done(id){
  if(id==='start')return !!role();
  if(id==='abstimmung')return !!store.get('eu_vote')&&(store.get('eu_ans_vote_why')||'').trim().length>=40;
  return store.get('eu_done_'+id)==='1';
}
function drawTabs(){
  const nav=$('#tabs');nav.innerHTML='';
  ST.forEach(s=>{
    const b=document.createElement('button');
    b.className=(s.id===cur?'act ':'')+(done(s.id)?'done':'');
    b.innerHTML=esc(s.tab)+'<span class="ck"> ✓</span>';
    b.disabled=(s.id!=='start'&&!role());
    b.onclick=()=>go(s.id);
    nav.appendChild(b);
  });
  const rb=$('#rolebadge');
  if(role()&&ROLES[role()]){rb.hidden=false;rb.textContent=ROLES[role()].ic+' '+ROLES[role()].name+' ℹ️';}else rb.hidden=true;
  $('#rolefab').classList.toggle('show',!!(role()&&ROLES[role()]&&cur!=='start'));
}
function go(id){cur=id;store.set('eu_station',id);render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){
  drawTabs();
  const m=$('#main');m.innerHTML='';
  if(cur==='start')return renderStart(m);
  if(cur==='abstimmung')return renderVote(m);
  renderStation(m,cur);
}
function navButtons(m){
  const i=ST.findIndex(s=>s.id===cur);
  const d=document.createElement('div');d.className='nav2';
  const prev=document.createElement('button');prev.className='btn ghost';prev.textContent='← Zurück';prev.onclick=()=>go(ST[i-1].id);
  const next=document.createElement('button');next.className='btn gold';next.textContent='Weiter →';next.onclick=()=>go(ST[i+1].id);
  if(i>0)d.appendChild(prev);else d.appendChild(document.createElement('span'));
  if(i<ST.length-1)d.appendChild(next);
  m.appendChild(d);
}
function renderStart(m){
  m.innerHTML=`<h2>Soll Novarien den Euro einführen?</h2>
  <p class="sub">Ein Planspiel für das Beratungsteam der Regierung</p>
  <p>Novarien ist ein kleines, fiktives Land. Es ist seit einigen Jahren Mitglied der Europäischen Union, bezahlt aber noch mit dem <b>Novar</b>. Die Regierung überlegt, den Euro einzuführen. In wenigen Wochen soll das Volk darüber abstimmen.</p>
  <p>Ihr arbeitet als Beratungsteam. Ihr schaut euch die Geschichte des Euro an, prüft die Bedingungen für den Beitritt, wägt Vor- und Nachteile ab, lernt die Eurokrise kennen und stimmt am Ende ab. Dabei schlüpft jede und jeder in eine Rolle von Menschen, die der Beitritt ganz unterschiedlich betrifft.</p>
  <div class="land"><div class="emb">${SVG_FLAG}${SVG_WAPPEN}</div><div><h3>Das Land Novarien</h3><ul><li>Hauptstadt: Aurelburg am Meer, rund 4,2 Millionen Einwohner</li><li>Währung: der Novar</li><li>Wappen: ein Leuchtturm zwischen Meer und Kornfeldern</li><li>Regierungschefin: Ministerpräsidentin Livia Marek</li></ul></div></div>
  ${mpBubble('Willkommen im Beratungsteam. In wenigen Wochen stimmt unser Volk über den Euro ab, und ich brauche eure Einschätzung. Ihr habt sechs Stationen vor euch.')}
  <h3>Das erwartet euch</h3>
  <ol>
   <li><b>Weg zum Euro:</b> Wie kam es zur gemeinsamen Währung?</li>
   <li><b>Die Hürden:</b> Welche Bedingungen muss Novarien erfüllen?</li>
   <li><b>Pro und Contra:</b> Was bringt der Euro, und was kostet er?</li>
   <li><b>Wert des Geldes:</b> Wechselkurs und Kaufkraft</li>
   <li><b>Die Eurokrise:</b> Was passierte in Griechenland und anderen Ländern, und was bedeutet das für Novarien?</li>
   <li><b>Abstimmung:</b> Ihr entscheidet und begründet.</li>
  </ol>
  <div class="box">Die Aufgaben bearbeitet ihr allein oder zu zweit. Eure Antworten werden nur in diesem Browser gespeichert. Die Ergebnisse besprecht ihr anschließend im Unterricht.</div>
  <h3>Wähle deine Rolle</h3>
  <div class="roles" id="roles"></div>
  <div id="rolehint"></div>`;
  const box=$('#roles');
  Object.entries(ROLES).forEach(([k,r])=>{
    const b=document.createElement('button');b.className='role'+(role()===k?' sel':'');
    b.innerHTML='<span class="ic">'+r.ic+'</span><b>'+esc(r.name)+'</b><small>'+esc(r.txt)+'</small>';
    b.onclick=()=>{store.set('eu_role',k);render();};
    box.appendChild(b);
  });
  if(role()){
    const h=$('#rolehint');
    h.innerHTML='<p style="margin-top:12px">Ab jetzt denkst du aus der Sicht von <b>'+esc(ROLES[role()].name)+'</b>. Du kannst die Rolle jederzeit hier wechseln.</p>';
    const b=document.createElement('button');b.className='btn gold';b.textContent='Los geht’s →';b.onclick=()=>go('geschichte');h.appendChild(b);
  }
  m.appendChild(resetBtn());
}
function renderStation(m,id){
  const C=CONTENT[id];
  m.innerHTML='<h2>'+C.title+'</h2><p class="sub">'+C.sub+'</p>'+(C.mp?mpBubble(C.mp):'')+C.text;
  const doneCheck=()=>{
    const all=widgets.every(w=>w.isDone());
    store.set('eu_done_'+id,all?'1':'0');
    drawTabs();
  };
  const widgets=[];
  C.tasks.forEach((t,i)=>{
    const d=document.createElement('div');d.className='task';
    const q=document.createElement('div');q.className='q';
    q.innerHTML='<span class="nr">'+(i+1)+'</span>'+(typeof t.q==='function'?t.q():t.q);
    d.appendChild(q);
    const w=t.w();widgets.push(w);
    d.appendChild(w);
    w.addEventListener('state',()=>{d.classList.toggle('ok',w.isDone());doneCheck();});
    d.classList.toggle('ok',w.isDone());
    m.appendChild(d);
  });
  navButtons(m);
}
function renderVote(m){
  const myTyped=(k,label)=>{const v=(store.get('eu_ans_'+k)||'').trim();return v?'<div class="mine"><b>'+label+'</b>\n'+esc(v)+'</div>':'';};
  m.innerHTML=`<h2>Station 6 – Die Abstimmung</h2>
  <p class="sub">Dein Votum als <b>${esc(ROLES[role()].name)}</b></p>
  ${mpBubble('Die Wahllokale öffnen bald. Wie entscheidet ihr, und warum?')}
  <p>Jetzt entscheidest du, wie du aus der Sicht deiner Rolle abstimmen würdest. Entscheide mit Blick auf alles, was du erarbeitet hast: die Kriterien, die Vor- und Nachteile und die Eurokrise.</p>
  <details style="margin:10px 0"><summary style="cursor:pointer;font-weight:700;color:var(--blue2)">Meine Notizen anzeigen</summary>
   ${myTyped('procontra_2','Meine wichtigsten Argumente (Station 3):')||'<p><i>Noch keine Notizen aus Station 3.</i></p>'}
   ${myTyped('krise_3','Meine Einschätzung zu den Sparauflagen (Station 5):')}
   ${myTyped('krise_4','Eurokrise und Beitritt (Station 5):')}
  </details>
  <h3>Wie stimmst du ab?</h3>
  <div class="vote" id="vote"></div>
  <h3>Begründe dein Votum</h3>
  <p>Nutze mindestens zwei Argumente aus dem Planspiel und beziehe die Lage deiner Rolle ein.</p>`;
  const vb=$('#vote');
  [['ja','Ja, Novarien führt den Euro ein'],['nein','Nein, Novarien behält den Novar'],['spaeter','Noch nicht, erst wenn bestimmte Bedingungen erfüllt sind']].forEach(([k,l])=>{
    const b=document.createElement('button');b.textContent=l;b.className=store.get('eu_vote')===k?'on':'';
    b.onclick=()=>{store.set('eu_vote',k);vb.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');drawTabs();};
    vb.appendChild(b);
  });
  const w=mkTyped('vote_why','',40,'Ich stimme so ab, weil …');
  w.addEventListener('state',drawTabs);
  m.appendChild(w);
  const d=document.createElement('div');d.className='box gold';
  d.innerHTML='<b>Zum Schluss:</b> Im Unterricht stellt ihr eure Entscheidungen vor. Überlegt, wie unterschiedlich die Rollen abgestimmt haben und welche Bedingungen für ein „Noch nicht“ erfüllt sein müssten.';
  m.appendChild(d);
  const n=document.createElement('p');n.className='note';
  n.textContent='Novarien ist ein erfundenes Land. Alle Zahlen zu Novarien sind frei erfunden. Das Bild der Ministerpräsidentin wurde mit KI erzeugt und zeigt eine erfundene Person. Die Angaben zu Euro, EU und Eurokrise beruhen auf öffentlichen Informationen der EU, der EZB und der Bundesregierung.';
  m.appendChild(n);
  navButtons(m);
  m.appendChild(resetBtn());
}
function openRole(){
  const r=ROLES[role()];if(!r)return;
  $('#rolecard').innerHTML='<div class="big">'+r.ic+'</div><h3>'+esc(r.name)+'</h3><p>'+esc(r.txt)+'</p><p><b>Beantworte alle Fragen aus der Sicht dieser Person.</b></p><div class="acts"><button class="btn gold" id="rclose" type="button">Verstanden</button><button class="btn ghost" id="rchange" type="button">Rolle wechseln</button></div>';
  $('#rolemodal').classList.add('open');
  $('#rclose').onclick=closeRole;
  $('#rchange').onclick=()=>{closeRole();go('start');};
}
function closeRole(){$('#rolemodal').classList.remove('open');}
$('#rolebadge').onclick=openRole;
$('#rolefab').onclick=openRole;
$('#rolemodal').addEventListener('click',e=>{if(e.target.id==='rolemodal')closeRole();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRole();});
render();
</script>
</body>
</html>
