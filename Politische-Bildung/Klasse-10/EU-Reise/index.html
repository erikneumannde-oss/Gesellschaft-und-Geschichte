if(!S||!S.a)S=fresh();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function qmax(q){return q.type==='match'?q.rows.length:q.type==='cards'?q.items.length:q.type==='order'?q.items.length:q.type==='slider'?3:1;}
function qpts(q){var r=S.a[q.id];if(!r)return 0;
 if(q.type==='match')return r.v.reduce(function(s,x,i){return s+(x===q.rows[i].c?1:0);},0);
 if(q.type==='cards')return r.v.reduce(function(s,x,i){return s+(x===q.items[i].c?1:0);},0);
 if(q.type==='order')return r.v.reduce(function(s,x,i){return s+(x===i?1:0);},0);
 if(q.type==='slider'){var d=Math.abs(r.v-q.target);return d<=q.tiers[0]?3:d<=q.tiers[1]?2:d<=q.tiers[2]?1:0;}
 return r.v===q.c?1:0;}
function qdone(q){var r=S.a[q.id];if(!r)return false;if(q.type==='cards')return r.v.length>=q.items.length;return true;}
function stDone(i){return ST[i].qs.every(qdone);}
function stPts(i){return ST[i].qs.reduce(function(s,q){return s+qpts(q);},0);}
function stMax(i){return ST[i].qs.reduce(function(s,q){return s+qmax(q);},0);}
var MAX=ST.reduce(function(s,_,i){return s+stMax(i);},0);
function total(){return ST.reduce(function(s,_,i){return s+stPts(i);},0);}
function reach(){var i=0;while(i<ST.length&&stDone(i))i++;return i;} // erste offene Station
function updHead(pop){var s=$('#score');s.textContent='⭐ '+total()+' / '+MAX;if(pop){s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop');}}
function updTabs(){var t=$('#tabs');t.innerHTML='';var r=reach();
 ST.forEach(function(s,i){var b=el('button',S.cur===i?'act':'',s.ico+' '+(i+1)+(stDone(i)?'<span class="ck">✓</span>':''));b.disabled=i>r;b.title=s.name;b.onclick=function(){go(i);};t.appendChild(b);});}
function go(c){S.cur=c;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function fbEl(ok,txt,why){var d=el('div');var f=el('div','fb '+(ok?'ok':'bad'),txt);d.appendChild(f);if(why)d.appendChild(el('div','why',why));return d;}
function cheer(ok){if(ok){S.streak=(S.streak||0)+1;}else S.streak=0;return ok&&S.streak>=3?' 🔥 '+S.streak+' in Folge':'';}
function ptsTag(q){return '<span class="pts">'+qpts(q)+' / '+qmax(q)+'</span>';}

// ---------- Fragetypen
function renderQ(q,box){box.innerHTML='';box.className='q'+(qdone(q)?' done':'');
 ({match:rMatch,cards:rCards,order:rOrder,mc:rMc,slider:rSlider}[q.type])(q,box);}
function head(q,box){box.appendChild(el('div','qh',(qdone(q)?ptsTag(q):'')+esc(q.q)));}
function after(q){updHead(true);save();updTabs();showNext();}

function rMatch(q,box){head(q,box);var r=S.a[q.id],sel=[];
 q.rows.forEach(function(row,i){var d=el('div','mrow'+(r?(r.v[i]===row.c?' good':' badr'):''));d.appendChild(el('div','',esc(row.t)));
  var s=el('select');s.disabled=!!r;s.innerHTML='<option value="">– wählen –</option>'+q.opts.map(function(o,k){return '<option value="'+k+'">'+esc(o)+'</option>';}).join('');
  if(r)s.value=r.v[i];s.onchange=check;sel.push(s);d.appendChild(s);
  if(r)d.appendChild(el('div','sol',(r.v[i]===row.c?'<b style="color:#1f8a4c">✓</b> ':'<b style="color:#b3261e">✗ Richtig wäre: '+esc(q.opts[row.c])+'.</b> ')+esc(row.w)));
  box.appendChild(d);});
 var b=el('button','btn','Antwort abgeben');b.disabled=true;
 function check(){b.disabled=sel.some(function(s){return s.value==='';});}
 if(!r){box.appendChild(el('p','','<small>Du kannst jede Frage nur einmal beantworten.</small>'));box.appendChild(b);}
 b.onclick=function(){S.a[q.id]={v:sel.map(function(s){return +s.value;})};var p=qpts(q);cheer(p===q.rows.length);after(q);renderQ(q,box);};
 if(r){var p=qpts(q);box.appendChild(fbEl(p===q.rows.length,p+' von '+q.rows.length+' richtig.',''));}}

var view={}; // Karten: angezeigter Index
function rCards(q,box){head(q,box);var r=S.a[q.id]||(S.a[q.id]={v:[]}),n=q.items.length;
 if(view[q.id]==null)view[q.id]=r.v.length;
 var vi=view[q.id];if(vi>=n&&r.v.length<n)vi=r.v.length;
 var dots=el('div','dots');for(var i=0;i<n;i++){dots.appendChild(el('i',(i<r.v.length?(r.v[i]===q.items[i].c?'ok':'bad'):'')+(i===vi?' cur':'')));}box.appendChild(dots);
 if(vi<n){var it=q.items[vi],answered=r.v.length>vi;box.appendChild(el('div','card',esc(it.t)));
  var o=el('div','opts '+(q.opts.length===2?'row':''));
  q.opts.forEach(function(lab,k){var b=el('button','opt',esc(lab));b.disabled=answered;
   if(answered){if(k===it.c)b.classList.add('right');else if(k===r.v[vi])b.classList.add('wrong');}
   b.onclick=function(){if(S.a[q.id].v.length>vi)return;S.a[q.id].v.push(k);var ok=k===it.c;var s=cheer(ok);save();updHead(ok);updTabs();
    renderQ(q,box);};o.appendChild(b);});
  box.appendChild(o);
  if(answered){var ok=r.v[vi]===it.c;box.appendChild(fbEl(ok,(ok?'✓ Richtig.':'✗ Leider nicht.')+(ok&&S.streak>=3?' 🔥 '+S.streak+' in Folge':''),esc(it.w)));
   var nb=el('button','btn gold',vi<n-1?'Nächste Karte ›':'Fertig ✓');nb.style.marginTop='10px';nb.onclick=function(){view[q.id]=vi+1;renderQ(q,box);showNext();};box.appendChild(nb);}
  else box.appendChild(el('p','','<small style="color:#51607c">Eine Antwort pro Karte, überlege kurz.</small>'));}
 else{var p=qpts(q);box.appendChild(fbEl(p>=n*0.7,p+' von '+n+' Karten richtig.',''));}
 if(r.v.length&&vi>0){var h=el('div','hist');for(var j=0;j<Math.min(vi,r.v.length);j++){var okj=r.v[j]===q.items[j].c;h.appendChild(el('div','','<b class="'+(okj?'ok':'bad')+'">'+(okj?'✓':'✗')+'</b> '+esc(q.items[j].t)+' – <i>'+esc(q.opts[q.items[j].c])+'</i>'));}box.appendChild(h);}
 box.className='q'+(qdone(q)&&vi>=n?' done':'');
 var tag=box.querySelector('.qh');if(tag&&r.v.length)tag.insertAdjacentHTML('afterbegin',ptsTag(q));
 showNext();}

function rOrder(q,box){head(q,box);var r=S.a[q.id];
 var pick=q._pick||(q._pick=[]);
 if(r){ // ausgewertet: Spalte „Deine Reihenfolge“ mit Markierung, danach die richtige
  var w=el('div','ordwrap');var a=el('div'),b=el('div');a.appendChild(el('h4','','Deine Reihenfolge'));b.appendChild(el('h4','','So ist es richtig'));
  r.v.forEach(function(item,pos){a.appendChild(el('div','slot fill '+(item===pos?'good':'badr'),'<span class="n">'+(pos+1)+'</span><span>'+esc(q.items[item])+'</span>'));});
  q.items.forEach(function(t,i){b.appendChild(el('div','slot fill','<span class="n">'+(i+1)+'</span><span>'+esc(t)+'</span>'));});
  w.appendChild(a);w.appendChild(b);box.appendChild(w);var p=qpts(q);box.appendChild(fbEl(p===q.items.length,p+' von '+q.items.length+' Schritten an der richtigen Stelle.',q.w));return;}
 var w2=el('div','ordwrap'),L=el('div'),R=el('div');L.appendChild(el('h4','','Die Schritte (antippen)'));R.appendChild(el('h4','','Deine Reihenfolge (antippen zum Entfernen)'));
 q.perm.forEach(function(idx){var c=el('button','chip'+(pick.indexOf(idx)>=0?' used':''),esc(q.items[idx]));c.disabled=pick.indexOf(idx)>=0;c.onclick=function(){pick.push(idx);renderQ(q,box);};L.appendChild(c);});
 for(var k=0;k<q.items.length;k++){(function(k){var s=el('div','slot'+(pick[k]!=null?' fill':''),'<span class="n">'+(k+1)+'</span><span>'+(pick[k]!=null?esc(q.items[pick[k]]):'')+'</span>');
  if(pick[k]!=null){s.onclick=function(){pick.splice(k,1);renderQ(q,box);};}R.appendChild(s);})(k);}
 w2.appendChild(L);w2.appendChild(R);box.appendChild(w2);box.appendChild(el('p','','<small>Du kannst die Reihenfolge ändern, bis du auf „Prüfen“ tippst. Danach zählt sie.</small>'));
 var b=el('button','btn','Prüfen');b.disabled=pick.length<q.items.length;b.onclick=function(){S.a[q.id]={v:pick.slice()};q._pick=null;var p=qpts(q);cheer(p===q.items.length);after(q);renderQ(q,box);};box.appendChild(b);}

function rMc(q,box){head(q,box);var r=S.a[q.id];var o=el('div','opts');
 q.opts.forEach(function(lab,k){var b=el('button','opt',esc(lab));b.disabled=!!r;if(r){if(k===q.c)b.classList.add('right');else if(k===r.v)b.classList.add('wrong');}
  b.onclick=function(){S.a[q.id]={v:k};var ok=k===q.c;cheer(ok);after(q);renderQ(q,box);};o.appendChild(b);});
 box.appendChild(o);if(!r)box.appendChild(el('p','','<small style="color:#51607c">Nur ein Versuch.</small>'));
 if(r){var ok=r.v===q.c;box.appendChild(fbEl(ok,(ok?'✓ Richtig.':'✗ Leider nicht.')+(ok&&S.streak>=3?' 🔥 '+S.streak+' in Folge':''),q.w));}}

function rSlider(q,box){head(q,box);var r=S.a[q.id];var val=r?r.v:q.start;
 var v=el('div','slval',val+q.unit);box.appendChild(v);
 var s=el('input','sl');s.type='range';s.min=q.min;s.max=q.max;s.step=q.step;s.value=val;s.disabled=!!r;s.oninput=function(){v.textContent=s.value+q.unit;};box.appendChild(s);
 if(!r){var b=el('button','btn','Schätzung abgeben');b.onclick=function(){S.a[q.id]={v:+s.value};var p=qpts(q);cheer(p>=2);after(q);renderQ(q,box);};box.appendChild(b);box.appendChild(el('p','','<small style="color:#51607c">Nur eine Schätzung.</small>'));}
 else{var span=q.max-q.min,pc=function(x){return ((x-q.min)/span*100).toFixed(1)+'%';};
  var bar=el('div','bar','<b class="t" style="left:calc('+pc(q.target)+' - 3px)" title="richtig"></b><b class="g" style="left:calc('+pc(r.v)+' - 3px)" title="deine Schätzung"></b>');box.appendChild(bar);
  box.appendChild(el('p','','<small>Grün: richtig · Blau: deine Schätzung</small>'));
  var p=qpts(q);box.appendChild(fbEl(p>=2,(p===3?'✓ Sehr nah dran!':p===2?'✓ Gut geschätzt.':p===1?'Ein Stück daneben.':'✗ Weit daneben.')+' Richtig: '+(q.target+q.unit).replace(/\.?$/,'.'),q.w));}}

// ---------- Seiten
var nextBox=null;
function showNext(){if(!nextBox)return;var i=S.cur;nextBox.innerHTML='';if(typeof i!=='number')return;
 var done=stDone(i);var last=i===ST.length-1;
 var b=el('button','btn gold',last?'Zur Auswertung 🏁':'Weiter zu Station '+(i+2)+' ›');b.disabled=!done;b.onclick=function(){go(last?'end':i+1);};
 nextBox.appendChild(el('div','',done?'<b style="color:#1f8a4c">Station geschafft: '+stPts(i)+' von '+stMax(i)+' Punkten.</b>':'<span style="color:#51607c">Beantworte alle Fragen dieser Station, dann geht es weiter.</span>'));
 nextBox.appendChild(b);}

function render(){var m=$('#main');m.innerHTML='';nextBox=null;updHead(false);updTabs();
 if(S.cur==='intro'){m.innerHTML='<h2>Willkommen in Brüssel!</h2><p class="place">Dein erster Tag als Praktikant/in bei der EU</p>'+
  '<p>Du arbeitest heute in sechs Stationen an den Fragen, die eine EU-Praktikantin oder ein EU-Praktikant kennen muss. Unterwegs sammelst du Punkte.</p>'+
  '<div class="box gold"><b>So funktioniert es</b><br>Jede Frage kannst du <b>nur einmal</b> beantworten. Danach siehst du sofort, was richtig war und warum. Lies deshalb genau und überlege kurz, bevor du antippst.</div>'+
  '<div class="box"><b>Insgesamt gibt es '+MAX+' Punkte.</b> Am Ende bekommst du einen Titel, vom „Neu im Haus“ bis zum „EU-Profi“. Dein Stand bleibt in diesem Browser gespeichert.</div>';
  var go1=el('button','btn gold','Los geht’s ›');go1.onclick=function(){go(reach()<ST.length?reach():'end');};m.appendChild(go1);return;}
 if(S.cur==='end'){renderEnd(m);return;}
 var st=ST[S.cur];m.appendChild(el('h2','',st.ico+' '+esc(st.name)));m.appendChild(el('p','place',esc(st.place)));
 st.info.forEach(function(h){m.appendChild(el('div','box',h));});
 st.qs.forEach(function(q){var box=el('div','q');m.appendChild(box);renderQ(q,box);});
 nextBox=el('div','nextbar');m.appendChild(nextBox);showNext();
 var si=S.cur,wipe=el('div','wipe');m.appendChild(wipe);
 (function showBtn(){wipe.innerHTML='';var d=el('button','btn ghost','🗑️ Daten dieser Station löschen');d.onclick=function(){wipe.innerHTML='';
  var y=el('button','btn','Ja, löschen');var n=el('button','btn ghost','Abbrechen');n.style.marginLeft='8px';
  y.onclick=function(){st.qs.forEach(function(q){delete S.a[q.id];delete view[q.id];q._pick=null;});S.streak=0;save();render();};n.onclick=showBtn;
  wipe.appendChild(el('span','','Alle Antworten und Punkte dieser Station werden gelöscht. '));wipe.appendChild(y);wipe.appendChild(n);};wipe.appendChild(d);})();}

function renderEnd(m){var t=total(),pc=t/MAX;var rk=RANKS[0];RANKS.forEach(function(r){if(pc>=r[0])rk=r;});
 m.innerHTML='<h2>Auswertung</h2><p class="place">Dein erster Tag in Brüssel ist vorbei</p>';
 var ring=el('div','ring','<span>'+t+'</span><small>von '+MAX+'</small>');ring.style.setProperty('--deg',(pc*360)+'deg');m.appendChild(ring);
 m.appendChild(el('div','rank','Dein Titel: '+rk[1]));var gr=pc>=0.9?1:pc>=0.75?2:pc>=0.6?3:pc>=0.45?4:pc>=0.15?5:6;m.appendChild(el('div','rank','Note: '+gr));m.appendChild(el('p','','<span style="display:block;text-align:center;margin-top:4px">'+rk[2]+'</span>'));
 m.appendChild(el('h3','','Deine Punkte je Station'));
 ST.forEach(function(s,i){var a=stPts(i),b=stMax(i);m.appendChild(el('div','br','<span>'+s.ico+' '+esc(s.name)+'</span><span class="b"><i style="width:'+(b?a/b*100:0)+'%"></i></span><span>'+a+'/'+b+'</span>'));});
 m.appendChild(el('h3','','Das nimmst du mit'));m.appendChild(el('ul','take',TAKE.map(function(x){return '<li>'+x+'</li>';}).join('')));
 m.appendChild(el('div','box gold','<b>Zum Weiterdenken:</b> Welches EU-Gesetz oder welche EU-Regel hat dein Alltag schon verändert? Und welche Regel würdest du als Praktikant/in in Brüssel vorschlagen?'));
 var again=el('button','btn ghost','Noch einmal spielen');var box=el('span');
 again.onclick=function(){box.innerHTML='';var y=el('button','btn','Ja, alles zurücksetzen');var n=el('button','btn ghost','Abbrechen');n.style.marginLeft='8px';
  y.onclick=function(){S=fresh();view={};ST.forEach(function(s){s.qs.forEach(function(q){q._pick=null;});});save();go('intro');};n.onclick=function(){render();};
  box.appendChild(el('span','','Alle Antworten und Punkte werden gelöscht. '));box.appendChild(y);box.appendChild(n);again.style.display='none';};
 var row=el('div','nextbar');row.appendChild(again);row.appendChild(box);m.appendChild(row);}

// Startansicht: Stand wiederherstellen
if(typeof S.cur==='number'&&S.cur>reach())S.cur=reach();
if(S.cur==='end'&&reach()<ST.length)S.cur=reach();
render();
})();
</script>
