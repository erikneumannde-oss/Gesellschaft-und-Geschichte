/* ===== Design: hell, EU-Blau und Gelb, digital ===== */
:root{--board:#1446b8;--board2:#0b3a8f;--chalk:#fff;--frame:#0b3a8f;--paper:#fff;--ink:#1b2640;--muted:#5b6785;--line:#d9e0ee;--gold:#ffcc00;--gold-d:#d9a800;--ok:#1f9d6b;--bad:#d63a4a;--blue:#1d6fe0}

.back{background:#fff;color:#0b3a8f;border:1px solid #c9d4ea}
.stars{background:#fff;border-color:#ffcc00;color:#8a6d00}
.tafel{background:linear-gradient(120deg,#0b3a8f,#1446b8 55%,#1d6fe0);border:0;border-radius:18px;padding:18px 92px 18px 18px;text-align:left;box-shadow:0 8px 22px rgba(11,58,143,.25);color:#fff;overflow:hidden}
.tafel h1{text-shadow:none;font-size:clamp(21px,5.4vw,30px);letter-spacing:0;position:relative;z-index:1}
.tafel .kreide,.tafel p{display:none}
.tafel .eu{position:absolute;right:10px;top:50%;width:84px;height:84px;transform:translateY(-50%);opacity:.95}
nav#tabs{background:linear-gradient(#eef2f9 72%,rgba(238,242,249,0))}
nav#tabs button{background:#fff;border-color:#d0d9ec;color:#1b2640}
nav#tabs button.on{background:#1446b8;border-color:#1446b8;color:#fff}
nav#tabs button.on.fin::after{color:#ffcc00}
h2{color:#0b3a8f}

    T('s1_mem', 'memory', 'Begriffe-Memory', 'Finde acht Paare aus Begriff und Erklärung.',
      'Du siehst sechzehn verdeckte Karten. Decke immer zwei auf: ein Begriff und seine Erklärung. Passen sie zusammen, bleiben sie offen. Wenn nicht, drehen sie sich wieder um. Merke dir, wo was liegt. Bei jedem Paar sage ich dir etwas dazu.',

        { a: 'Beweislast', clues: ['Wer mich trägt, muss etwas beweisen.', 'Früher musste die Aufsicht beweisen, dass etwas falsch ist.', 'Beim Kids Act tragen mich die Plattformen: Sie müssen beweisen, dass sie sicher sind.'], why: 'Die Beweislast verschiebt sich von den Aufsichtsbehörden auf die Plattformen.' },

    T('s1_find', 'find', 'Mythen-Check', 'Drei von acht Sätzen stimmen nicht. Finde sie.',
      'Unten stehen acht Sätze zum EU Kids Act. Drei davon sind falsch, die anderen stimmen. Tippe die falschen Sätze an und gib sie mit „Meine Fehler melden“ ab. Ich sage dir, ob du richtig liegst.',

/* ============================================================ 3 LESEN */
{ id: 'l2', ico: '📖', kind: 'lesen', title: 'Lesen: Tricks und Streit', sub: 'Zwei Texte, danach Fragen dazu',
  intro: 'Auch hier gilt: Lies zuerst die beiden Texte in Ruhe. Unbekannte Wörter erkläre ich dir: Tippe mich an, wähle „Wort erklären“ und markiere das Wort. Danach folgen die Fragen.',
  texts: [
    { title: 'Text 3: Die Tricks der Apps', p: [
      'Die EU-Kommission beschreibt viele Plattformen als <b>hochgradig süchtig machend</b>. Sie seien darauf ausgelegt, die Aufmerksamkeit so lange wie möglich zu binden. Der EU Kids Act soll deshalb nicht nur Altersgrenzen setzen, sondern auch verbieten, wie Apps gebaut sind. Dieses Verbot soll für alle <b>unter 18</b> gelten.',
      'Folgende Tricks sollen für Minderjährige eingeschränkt werden: <b>Endloses Scrollen und Autoplay:</b> Es gibt kein Ende, das nächste Video startet von allein. <b>Streaks:</b> Eine Serie zählt die Tage in Folge. Wer einen Tag auslässt, verliert sie. <b>Push-Nachrichten:</b> Das Handy meldet sich und holt Kinder zurück, auch ohne dass sie etwas vorhatten. Dazu gehören Nachrichten in der Schlafenszeit. <b>Belohnungen:</b> Die App belohnt, wenn man oft und lange dabei ist.',
      'Auch die Videos, die die App zeigt, spielen eine Rolle. Ein <b>Empfehlungs-Algorithmus</b> wählt aus, was man als Nächstes sieht. Oft lernt er aus dem Verhalten, wie man am längsten bleibt, und kann Jugendliche in einen „Kaninchenbau“ aus immer ähnlichen, manchmal schädlichen Inhalten ziehen. Der Entwurf will, dass Empfehlungen auf Sicherheit und seelische Gesundheit achten. Personalisierung durch <b>Tracking</b> soll standardmäßig ausgeschaltet sein.',
      'Was Apps stattdessen müssen: wirksame <b>Pausen und Zeitlimits</b> anbieten, Profile Minderjähriger standardmäßig <b>privat</b> einstellen, Kontakt durch Fremde nur mit Erlaubnis zulassen und das Blockieren und Stummschalten einfach machen. KI-Begleiter sind standardmäßig ausgeschaltet und dürfen Kinder nicht emotional abhängig machen.'] },
    { title: 'Text 4: Befürworter und Kritiker', p: [
      'Über den Entwurf wird heftig gestritten. <b>Die Kommission</b> sagt: Kinder verdienen ein sichereres Internet (so Ursula von der Leyen). Ihre Vizepräsidentin Henna Virkkunen nennt den Entwurf einen <b>Aufschub statt eines Verbots</b>: Kinder bekommen ab 13, 15 und 18 Jahren schrittweise mehr Zugang. Die Kinderrechts-Organisation <b>Save the Children</b> unterstützt Altersgrenzen, wenn die Altersprüfung den Datenschutz einhält. Auch die Medienaufsicht <b>KJM</b> hält Alterskontrollen für nötig, damit gestufte Zugänge funktionieren.',
      'Die <b>Kritiker aus dem Datenschutz</b> warnen vor der Kontrolle selbst. Sie würde <b>alle</b> Nutzer treffen, auch Erwachsene. Der <b>Chaos Computer Club</b> sieht die anonyme Nutzung des Internets in Gefahr. Die Organisation <b>EDRi</b> sagt, dass Menschen ohne Ausweis oder Smartphone benachteiligt würden. Mehr als 400 Forschende aus IT-Sicherheit und Datenschutz warnten im März in einem offenen Brief vor Alterskontrollen.',
      'Andere Kritiker kommen aus der <b>Jugend- und Elternarbeit</b>. Die <b>Bundesschülerkonferenz</b> sagt: Verbote allein lehren keinen sicheren Umgang, Jugendliche sollten vorher beteiligt werden. Der <b>Kinderschutzbund</b> warnt, der Zugang dürfe nicht allein von der Zustimmung der Eltern abhängen, besonders nicht bei Jugendlichen aus belasteten Familien. Das <b>Deutsche Kinderhilfswerk</b> kritisiert einen Ausschluss ohne passende Alternativen. Der <b>Deutsche Lehrerverband</b> meint: Teilhabe lässt sich nicht auf einen Geburtstag verschieben, Pflichten für Plattformen sollten für alle Altersgruppen gelten.',
      '<b>Wirken Verbote überhaupt?</b> Kritiker verweisen auf Australien. Dort gilt seit dem 10. Dezember 2025 ein Verbot für unter 16-Jährige. Drei Monate danach befragte die australische Regierung 10- bis 15-Jährige: Vor dem Verbot nutzten <b>85,9 %</b> die betroffenen Plattformen, danach noch <b>81,5 %</b>. Die meisten hatten ihre Konten also noch, vor allem weil die Plattformen kaum kontrollierten. Befürworter halten dagegen: Der EU-Entwurf verlangt eine geprüfte Alterskontrolle statt eines eingetippten Geburtsdatums und verbietet zusätzlich süchtig machende Tricks.',
      'Ein weiterer Kritikpunkt kommt von EDRi: <b>Das Alter ist nicht das eigentliche Problem.</b> Die Ursachen lägen im Geschäftsmodell der Plattformen und in manipulativen Praktiken. Der Entwurf setze beim Aufschub an statt bei der Gestaltung. Dem entgegnet die Kommission: Gerade deshalb verbiete der Entwurf auch süchtig machendes Design.'] }
  ],
  tasks: [
    T('l2_q1', 'duell', 'Fragen zu Text 3', 'Beantworte die Fragen zum Text „Die Tricks der Apps“.',
      'Ich stelle dir sieben Fragen zu Text 3. Wähle bei jeder Frage die richtige Antwort. Wenn du falsch liegst, sage ich dir, wo du nachlesen kannst.',
      ['Die Antworten stehen im Text.', 'Streaks, Push-Nachrichten und Autoplay sind Beispiele für Tricks.'],
      { label: 'Frage', wrong: 'Das stimmt nicht. Lies die passende Stelle in Text 3 noch einmal.', win: 'Du hast Text 3 gut verstanden.', n: 7, qs: [
        { q: 'Für wen soll das Verbot süchtig machender Tricks gelten?', opts: ['Für alle unter 18', 'Nur für unter 13-Jährige', 'Nur für 13- und 14-Jährige', 'Nur für Erwachsene'], a: 0, why: 'Das Verbot soll für alle Minderjährigen gelten, also für alle unter 18.' },
        { q: 'Was ist ein Streak?', opts: ['Eine Tages-Serie, die reißt, wenn man auslässt', 'Eine Belohnung für ein besonders gutes Video', 'Eine Nachricht, die direkt von der Plattform kommt', 'Ein Filter, der Fotos automatisch verschönert'], a: 0, why: 'Wer einen Tag auslässt, verliert die Serie. Das soll zum täglichen Öffnen anregen.' },
        { q: 'Was bewirken Push-Nachrichten in der Schlafenszeit?', opts: ['Sie holen Kinder zurück in die App', 'Sie helfen den Kindern beim Einschlafen', 'Sie zeigen den Kindern die Uhrzeit an', 'Sie sperren die App für den Rest des Tages'], a: 0, why: 'Push-Nachrichten melden sich von allein und holen Kinder zurück.' },
        { q: 'Was macht der Empfehlungs-Algorithmus?', opts: ['Er sucht aus, was man als Nächstes sieht', 'Er prüft das Alter aller Nutzerinnen und Nutzer', 'Er sperrt alle Konten nach einer Stunde Nutzung', 'Er löscht schädliche Videos automatisch sofort'], a: 0, why: 'Der Algorithmus wählt Beiträge aus, oft so, dass man möglichst lange bleibt.' },
        { q: 'Wie sollen Profile Minderjähriger standardmäßig eingestellt sein?', opts: ['Privat', 'Öffentlich', 'Gar nicht sichtbar', 'Nur für die Schule sichtbar'], a: 0, why: 'Profile Minderjähriger sollen standardmäßig privat sein.' },
        { q: 'Was sollen Apps stattdessen anbieten?', opts: ['Wirksame Pausen und Zeitlimits', 'Mehr Belohnungen für längere Nutzung', 'Mehr Werbung in den Pausen', 'Tägliche Pflicht-Logins'], a: 0, why: 'Pausen und Zeitlimits sollen die Nutzung begrenzen helfen.' },
        { q: 'Was gilt für KI-Begleiter nach dem Entwurf?', opts: ['Sie sind von Anfang an ausgeschaltet', 'Sie sind für alle Jugendlichen eine Pflicht', 'Sie dürfen Kinder ruhig abhängig machen', 'Sie sind nur nachts überhaupt erlaubt'], a: 0, why: 'KI-Begleiter sind standardmäßig aus und dürfen nicht emotional abhängig machen.' }] },
      { go: '▶ Fragen starten' }),
    T('l2_q2', 'duell', 'Fragen zu Text 4', 'Beantworte die Fragen zum Text „Befürworter und Kritiker“.',
      'Jetzt kommen acht Fragen zu Text 4. Bei jeder Frage geht es darum, wer was sagt. Wähle die richtige Antwort.',
      ['Achte darauf, wer etwas sagt: Kommission, Datenschützer, Jugend- oder Elternarbeit?', 'Die Namen der Organisationen stehen fett gedruckt im Text.'],
      { label: 'Frage', wrong: 'Das stimmt nicht. Lies die passende Stelle in Text 4 noch einmal.', win: 'Du hast auch Text 4 gut verstanden.', n: 8, qs: [
        { q: 'Was meint Henna Virkkunen mit „Aufschub statt Verbot“?', opts: ['Kinder bekommen Stück für Stück mehr Zugang', 'Social Media wird für alle Menschen verboten', 'Das ganze Gesetz wird auf später verschoben', 'Nur Erwachsene dürfen soziale Medien nutzen'], a: 0, why: 'Kinder bekommen ab 13, 15 und 18 schrittweise mehr Zugang.' },
        { q: 'Wovor warnt der Chaos Computer Club?', opts: ['Vor Gefahren für die anonyme Internetnutzung', 'Vor zu wenigen Altersstufen im ganzen Entwurf', 'Vor zu hohen Strafen gegen die Plattformen', 'Vor zu viel Medienbildung an den Schulen'], a: 0, why: 'Der CCC sieht die anonyme Internetnutzung durch Alterskontrollen in Gefahr.' },
        { q: 'Was sagt die Bundesschülerkonferenz?', opts: ['Verbote allein lehren keinen sicheren Umgang', 'Social Media sollte für alle verboten werden', 'Alterskontrollen sind unnötig, weil niemand schummelt', 'Plattformen sollten selbst entscheiden'], a: 0, why: 'Sie fordert außerdem, dass Jugendliche vorher beteiligt werden.' },
        { q: 'Wer unterstützt Altersgrenzen, wenn die Prüfung den Datenschutz einhält?', opts: ['Save the Children', 'Der Chaos Computer Club', 'EDRi', 'Der Lehrerverband'], a: 0, why: 'Save the Children unterstützt Altersgrenzen mit datenschutzkonformer Prüfung.' },
        { q: 'Was ist die zentrale Kritik von EDRi?', opts: ['Nicht das Alter, sondern das Geschäftsmodell ist es', 'Die Strafen im Entwurf sind für Konzerne zu niedrig', 'Der Entwurf ist insgesamt viel zu kurz und zu vage geraten', 'Kinder sollten gar keine eigenen Handys haben dürfen'], a: 0, why: 'EDRi sagt, der Entwurf setze beim Aufschub an statt bei der Gestaltung der Plattformen.' },
        { q: 'Was entgegnet die Kommission auf diese Kritik?', opts: ['Der Entwurf verbietet auch süchtig machendes Design', 'Die Kritik ist falsch, weil Jugendliche immer schummeln', 'Das Geschäftsmodell ist nicht änderbar', 'Der Entwurf wird zurückgezogen'], a: 0, why: 'Genau deshalb verbietet der Entwurf auch süchtig machendes Design.' },
        { q: 'Was zeigte die Umfrage in Australien drei Monate nach dem Verbot?', opts: ['Die Nutzung ging nur wenig zurück', 'Fast niemand nutzte danach noch Social Media', 'Die Nutzung hat sich danach verdoppelt', 'Die Jugendlichen wurden gar nicht befragt'], a: 0, why: 'Vorher nutzten 85,9 %, danach noch 81,5 % der 10- bis 15-Jährigen die betroffenen Plattformen.' },
        { q: 'Was fordert der Deutsche Lehrerverband?', opts: ['Pflichten für Plattformen, die für alle gelten', 'Ein Verbot sozialer Medien ab dem 15. Geburtstag', 'Mehr Handys für die Arbeit in den Klassenräumen', 'Keine Altersgrenzen und überhaupt keine Regeln'], a: 0, why: 'Teilhabe lasse sich nicht auf einen Geburtstag verschieben, sagt der Lehrerverband.' }] },
      { go: '▶ Fragen starten' })
  ] },

{ id: 's2', ico: '⚖️', kind: 'spiel', title: 'Spielen und Argumentieren', sub: 'Tricks entlarven, Sichtweisen, Argumente',
  intro: 'Zuerst geht es um die Tricks der Apps und die Sichtweisen. Danach übst du das Argumentieren, damit du gut für die Diskussion gerüstet bist. Auf „Spiel starten“ erkläre ich dir jeweils die Regeln.',

  tasks: [
    T('s2_feed', 'zeitfresser', 'Der Zeitfresser', 'Du willst nur kurz schauen. Schaffst du es, rechtzeitig aufzuhören?',
      'Stell dir vor: Es ist 18:40 Uhr. Um 19:00 Uhr musst du zum Training. Du schaust nur kurz in eine Video-App. Der Feed läuft von allein. Jedes Video entspricht vier Minuten in echter Zeit, die Uhr oben läuft mit. Tippe auf „App schließen“, wenn du aufhören willst. Danach gehen wir gemeinsam durch, was die App getan hat.',

      { start: 18 * 60 + 40, deadline: 19 * 60, vmin: 4, wait: 7000, videos: [['🐱', 'Katze rutscht vom Sofa'], ['🛹', 'Skate-Trick in der Halle'], ['🍕', 'Pizza in 30 Sekunden'], ['🎸', 'Straßenmusik in Berlin'], ['🐶', 'Hund lernt ein Kunststück'], ['⚽', 'Tor des Monats'], ['🎨', 'Zeichnen im Zeitraffer'], ['🌋', 'Vulkan von oben'], ['🚲', 'Radtour am Wasser'], ['🎤', 'Schulband im Proberaum']] }),

      { fig: FIG, goText: 'Tippe auf ein Element der App. Ich frage dich dann, was es bewirkt.', spots: [
        { name: 'Der Tab „Für dich“', r: [35, 8.5, 75.5, 13.6], q: 'Wer entscheidet, welche Videos hier erscheinen, und was sieht der Entwurf dazu vor?', opts: ['Ein Algorithmus, der auf Sicherheit achten soll', 'Die Eltern, die jedes Video vorher einzeln freigeben', 'Ein Zufallsgenerator, der künftig verboten werden soll', 'Die Schule, die alle Videos vorher gründlich überprüft'], a: 0, why: 'Ein Empfehlungs-Algorithmus wählt aus. Der Entwurf will, dass er auf Sicherheit und seelische Gesundheit achtet und Tracking-Personalisierung standardmäßig aus ist.' },
        { name: 'Die Flamme mit der Zahl', r: [6.5, 15, 27.5, 19.8], q: 'Was ist hier der Trick, und was sieht der Entwurf dazu vor?', opts: ['Eine Serie, die reißt, wenn man auslässt. Das soll eingeschränkt werden', 'Eine Belohnung fürs Aufhören. Sie soll künftig stark ausgebaut werden', 'Ein Zähler für alle Likes. Er soll genau so sichtbar bleiben, wie er ist', 'Eine Warnung vor Betrug im Netz. Sie soll für alle Apps Pflicht werden'], a: 0, why: 'Streaks bestrafen, wenn man nicht täglich zurückkommt. Der Entwurf will solche Mechaniken für Minderjährige einschränken.' },
        { name: 'Die Leiste im Video', r: [6.7, 54.8, 93.3, 59.6], q: 'Was bewirkt die Leiste „Nächstes Video in 3 …“, und was soll sich ändern?', opts: ['Das nächste Video startet allein. Endloses Autoplay soll wegfallen', 'Das Video wird sofort gelöscht. Das soll künftig automatisch passieren', 'Die App fragt alle 3 Sekunden nach dem Alter. Das soll Pflicht sein', 'Die App speichert das Video ab. Das soll künftig verboten werden'], a: 0, why: 'Das ist Autoplay. Endloses Weiterlaufen ohne echte Pausen soll es für Minderjährige nicht mehr geben.' },
        { name: 'Das Banner', r: [5.3, 63, 94.7, 72.6], q: 'Warum meldet sich die App mit so einer Nachricht, und was sieht der Entwurf vor?', opts: ['Sie will zurückholen. Solche Nachrichten sollen eingeschränkt werden', 'Sie warnt vor gefährlichen Viren auf dem Gerät. Das soll Pflicht werden', 'Sie bietet Hilfe bei Problemen an. Das soll künftig verboten werden', 'Sie meldet das Alter der Person an die Eltern. Das soll geprüft werden'], a: 0, why: 'Push-Nachrichten holen Kinder zurück, auch ohne dass sie etwas vorhatten. Gerade in der Schlafenszeit sollen sie eingeschränkt werden.' },
        { name: 'Die Videos darunter', r: [5.3, 74.8, 94.7, 95.2], q: 'Was zeigt das Stück Feed unter dem Video, und was fordert der Entwurf?', opts: ['Es gibt kein Ende. Der Entwurf verlangt Pausen und Zeitlimits', 'Der Feed endet nach zehn Videos. Das soll genau so bleiben', 'Es sind Werbeblöcke im Feed. Sie sollen künftig länger werden', 'Es sind Freunde der Person. Sie müssen erst freigegeben werden'], a: 0, why: 'Endloses Scrollen hat keinen natürlichen Stopp. Der Entwurf verlangt wirksame Pausen und Zeitlimits.' }] }),
    T('s2_wer', 'duell', 'Wer würde das sagen?', 'Ordne Aussagen den Sichtweisen aus der Debatte zu.',

      ['Lies in Text 4 nach, worum es jeder Gruppe geht.', 'Überlege: Geht es um Schutz, um Daten, um Mitsprache, um Teilhabe oder um die Ursache?'],
      { label: 'Aussage', n: 8, fixed: ['EU-Kommission', 'Datenschützer', 'Schülervertretung', 'Kinderschutzbund', 'Lehrerverband', 'EDRi'], defs: { 'EU-Kommission': 'Die EU-Kommission hat den Entwurf geschrieben und will Kinder einheitlich schützen.', 'Datenschützer': 'Datenschützer wie der Chaos Computer Club warnen vor den Folgen der Alterskontrolle für alle Nutzer.', 'Schülervertretung': 'Die Bundesschülerkonferenz will, dass Jugendliche mitreden und den Umgang lernen.', 'Kinderschutzbund': 'Der Kinderschutzbund denkt besonders an Jugendliche aus belasteten Familien.', 'Lehrerverband': 'Der Lehrerverband fordert Pflichten für Plattformen für alle Altersgruppen.', 'EDRi': 'EDRi kritisiert, dass der Entwurf nicht bei den Ursachen im Geschäftsmodell ansetzt.' }, win: 'Du kannst die Sichtweisen jetzt gut auseinanderhalten.', qs: [
        { q: '„Kinder verdienen ein sichereres Internet. Wir geben ihnen den Zugang Schritt für Schritt.“', opts: ['EU-Kommission'], a: 0, why: 'Das ist die Sicht der Kommission, die den Aufschub statt eines Verbots betont.' },
        { q: '„Wir brauchen keine Maßnahme gegen das Netz, wir brauchen eine gegen das Geschäftsmodell der Plattformen.“', opts: ['EDRi'], a: 0, why: 'EDRi sagt: Das Alter ist nicht das eigentliche Problem, sondern das Geschäftsmodell.' },
        { q: '„Wer sich im Netz nur mit Ausweis bewegen darf, kann nicht mehr anonym bleiben.“', opts: ['Datenschützer'], a: 0, why: 'Das ist die Sorge von Datenschützern wie dem Chaos Computer Club.' },
        { q: '„Wir wollen vorher gefragt werden, denn mit einem Verbot allein lernen wir nichts.“', opts: ['Schülervertretung'], a: 0, why: 'Das ist die Forderung der Bundesschülerkonferenz.' },
        { q: '„Manche Eltern haben keine Zeit oder Unterstützung. Der Zugang darf nicht allein von ihnen abhängen.“', opts: ['Kinderschutzbund'], a: 0, why: 'Der Kinderschutzbund warnt vor Nachteilen für Jugendliche aus belasteten Familien.' },
        { q: '„Mitmachen kann man nicht auf einen Geburtstag verschieben. Plattformen sollten für alle sicherer werden.“', opts: ['Lehrerverband'], a: 0, why: 'Das sagt der Deutsche Lehrerverband.' },
        { q: '„Die Beweislast soll bei den Plattformen liegen, nicht bei den Behörden.“', opts: ['EU-Kommission'], a: 0, why: 'Das steht im Entwurf der Kommission.' },
        { q: '„Wenn für alle das Alter geprüft wird, entsteht eine riesige Infrastruktur, die man missbrauchen kann.“', opts: ['Datenschützer'], a: 0, why: 'Datenschützer warnen vor dem Missbrauch der entstehenden Kontrollstruktur.' },
        { q: '„Kinder ohne Ausweis, ohne Smartphone oder ohne Hilfe zu Hause könnten Online-Gemeinschaften verlieren.“', opts: ['EDRi'], a: 0, why: 'Diese Sorge nennt EDRi für Menschen ohne Ausweis oder Smartphone und für Kinder mit wenig Unterstützung.' },
        { q: '„Jugendliche brauchen ein Fach, in dem sie den Umgang mit Social Media lernen.“', opts: ['Schülervertretung'], a: 0, why: 'Mehr Medienbildung wird auch von der Schülervertretung gefordert.' },
        { q: '„Verbote allein lösen es nicht. Wir müssen alle Plattformen verpflichten, nicht nur für Kinder.“', opts: ['Lehrerverband'], a: 0, why: 'Der Lehrerverband fordert Plattformpflichten für alle Altersgruppen.' },
        { q: '„Hohe Strafen wirken: Wer nicht sicher ist, zahlt bis zu 6 % vom Jahresumsatz.“', opts: ['EU-Kommission'], a: 0, why: 'Die Strafen stehen im Entwurf der Kommission.' }] }, { sect: 'Sichtweisen' }),
    T('s2_waage', 'waage', 'Die Argument-Waage', 'Sortiere zwölf Aussagen: Spricht sie für oder gegen den Gesetzentwurf?',

      ['Lies bis zum Ende: Oft entscheidet erst der zweite Teil des Satzes, auf welche Seite ein Argument gehört.', 'Frage dich: Würde die EU-Kommission das sagen, oder eher jemand, der den Entwurf kritisiert?'],

        ['Ein Aufschub ist kein Verbot: Kinder bekommen schrittweise mehr Zugang.', 0, 'Das ist ein Argument dafür: Es soll zeigen, dass der Entwurf Teilhabe nicht ausschließt.'],
        ['Wenn Eltern über Kontakte entscheiden, werden sie von Begleitern zu Kontrolleuren.', 1, 'Das ist ein Argument dagegen (Gesellschaft für Medienpädagogik).'],
        ['Bei Verstößen drohen Strafen bis zu 6 % vom Umsatz, das beeindruckt auch Weltkonzerne.', 0, 'Das ist ein Argument dafür: Es zeigt, warum die Regeln durchsetzbar sein sollen.'],
        ['In Australien ging die Nutzung nach dem Verbot nur von 85,9 % auf 81,5 % zurück.', 1, 'Das ist ein Argument dagegen: Die Zahlen sollen zeigen, dass Verbote kaum wirken.'],
        ['Die Plattform erfährt bei der Alterskontrolle nur ein Ja oder Nein, nicht mehr über die Person.', 0, 'Das ist ein Argument dafür: Es soll die Sorge um den Datenschutz entkräften.'],
        ['Endlich müssen die Plattformen beweisen, dass sie sicher sind, und nicht mehr die Behörden.', 0, 'Das ist ein Argument dafür: Die Beweislast liegt bei denen, die mit den Apps Geld verdienen.'],
        ['Kinder zu schützen ist richtig, aber dafür müssten sich bald alle im Netz ausweisen, auch Erwachsene.', 1, 'Das ist ein Argument dagegen: Der erste Teil klingt zustimmend, aber am Ende steht die Kritik an der Alterskontrolle für alle.'],
        ['Sicheres Design klingt gut, doch Medienkompetenz entsteht nicht durch Aussperren.', 1, 'Das ist ein Argument dagegen (Deutscher Lehrerverband): Es lobt einen Teil, kritisiert aber den Ausschluss.'],
        ['Viele Jugendliche finden Verbote nervig, doch Autoplay und Streaks halten auch sie gegen ihren Willen fest.', 0, 'Das ist ein Argument dafür: Der erste Teil klingt nach Kritik, aber am Ende steht der Grund für das Verbot süchtig machender Tricks.']] }, { sect: 'Argumente üben' }),
    T('s2_entkraeften', 'duell', 'Entkräften', 'Finde zu jedem Argument die passende Antwort der Gegenseite.',

      ['Lies die Antworten genau: Welche antwortet wirklich auf das Argument?', 'Manche Antworten sind zwar richtig, gehören aber zu einem anderen Argument.'],
      { label: 'Argument', n: 6, wrong: 'Diese Antwort passt nicht zu dem Argument. Sie geht auf etwas anderes ein. Lies noch einmal, worum es im Argument genau geht.', win: 'Du kannst Argumente jetzt aus der Sicht der Gegenseite beantworten. Das macht jede Diskussion stärker.', qs: [
        { q: 'Argument (Kritiker): „Die Alterskontrolle trifft alle Nutzer, auch Erwachsene.“', opts: ['Die Plattform erfährt nur „Ja“ oder „Nein“, per EU-App', 'Die Strafen für Plattformen können sehr hoch ausfallen, bis zu 6 %', 'Mit 15 dürfen Jugendliche ein eigenes Konto haben und nutzen', 'Die Eltern behalten im Mini-Konto die volle Kontrolle über alles'], a: 0, why: 'Die Kommission antwortet mit der datensparenden Prüfung: Die Plattform erfährt nur Ja oder Nein.' },
        { q: 'Argument (Kritiker): „Das Alter ist nicht das eigentliche Problem, sondern das Geschäftsmodell.“', opts: ['Der Entwurf verbietet auch süchtig machendes Design', 'Die Alterskontrolle läuft über eine kostenlose EU-App', 'Im Mini-Konto behalten die Eltern die Kontrolle', 'Ab 15 gibt es ein eigenes Konto für Jugendliche'], a: 0, why: 'Die Kommission verweist darauf, dass der Entwurf zusätzlich süchtig machendes Design verbietet.' },
        { q: 'Argument (Befürworter): „Die Apps sind darauf ausgelegt, dass Kinder möglichst lange bleiben.“', opts: ['Geräteeinstellungen und Medienbildung genügen, sagen Kritiker', 'Die Plattform erfährt bei der Prüfung nur ein Ja oder ein Nein', 'Bei Verstößen drohen Strafen von bis zu 6 % des Jahresumsatzes', 'Mit 15 Jahren dürfen Jugendliche ein eigenes Konto eröffnen'], a: 0, why: 'Kritiker wie die Stiftung Datenschutz sehen mildere Mittel wie Geräteeinstellungen und mehr Medienbildung.' },
        { q: 'Argument (Kritiker): „In Australien nutzten nach dem Verbot noch 81,5 % die Plattformen. Verbote wirken kaum.“', opts: ['Der Entwurf verlangt geprüfte Kontrollen und verbietet Suchttricks', 'Die Plattform erfährt bei der Alterskontrolle nur ein Ja oder ein Nein', 'Der Rat der EU muss dem Entwurf der Kommission noch zustimmen', 'Mit 15 Jahren dürfen Jugendliche ein eigenes Konto eröffnen'], a: 0, why: 'Befürworter sagen: Der EU-Entwurf geht über ein reines Verbot hinaus, mit geprüfter Altersprüfung und Design-Regeln.' },
        { q: 'Argument (Kritiker): „Der Zugang darf nicht allein von der Zustimmung der Eltern abhängen.“', opts: ['Die Eltern-Werkzeuge im Mini-Konto sind immer schon aktiv', 'Die Plattform erfährt bei der Prüfung nur ein Ja oder ein Nein', 'Die Kommission prüft bis 2030 die Folgen für die Grundrechte', 'Der Entwurf verbietet auch süchtig machendes Design der Apps'], a: 0, why: 'Die Kommission verweist auf die immer aktiven Eltern-Werkzeuge. Die Sorge um belastete Familien bleibt als Kritik bestehen.' },
        { q: 'Argument (Befürworter): „Ein EU-Gesetz verhindert einen Flickenteppich aus 27 Regeln.“', opts: ['Laut Hans-Bredow-Institut sind die Vorgaben kaum erfüllbar', 'Der Entwurf verbietet zusätzlich auch süchtig machendes Design', 'Die Plattform erfährt bei der Prüfung nur ein Ja oder ein Nein', 'Mit 13 gibt es ein Mini-Konto, das die Eltern einrichten'], a: 0, why: 'Das Hans-Bredow-Institut hält die Anforderungen des Entwurfs nach dem Stand der Technik für nicht erfüllbar.' }] }),
    T('s2_fm', 'duell', 'Fakt, Meinung oder beides?', 'Entscheide, ob eine Aussage ein Fakt, eine Meinung oder eine Mischung ist.',

      ['Frage dich: Kann man das nachschlagen? Und: Steckt ein Urteil darin, zum Beispiel „gut“, „zu viel“ oder „sinnvoll“?', 'Bei einer Mischung gibt es einen prüfbaren Teil und einen wertenden Teil.'],
      { label: 'Aussage', n: 8, fixed: ['Fakt', 'Meinung', 'Mischung'], defs: { 'Fakt': 'Ein Fakt lässt sich prüfen, zum Beispiel durch Nachschlagen.', 'Meinung': 'Eine Meinung ist eine Einschätzung. Man kann sie teilen oder nicht, aber nicht einfach nachprüfen.', 'Mischung': 'Eine Mischung enthält einen prüfbaren Teil und ein Urteil darüber.' }, win: 'Du kannst Fakten, Meinungen und Mischungen auseinanderhalten. Das hilft dir in jeder Diskussion.', qs: [
        { q: 'Die EU-Kommission hat den EU Kids Act am 17. September 2026 vorgeschlagen.', opts: ['Fakt'], a: 0, why: 'Das lässt sich nachprüfen.' },
        { q: 'Ein Verbot ist der beste Weg, Kinder zu schützen.', opts: ['Meinung'], a: 0, why: '„Der beste Weg“ ist eine Einschätzung, die sich nicht einfach nachprüfen lässt.' },
        { q: 'Weil die Nutzung in Australien nur von 85,9 % auf 81,5 % sank, ist das Verbot gescheitert.', opts: ['Mischung'], a: 0, why: 'Die Zahlen sind ein Fakt. „Gescheitert“ ist eine Bewertung.' },
        { q: 'Mini-Konten dürfen höchstens eine Stunde pro Tag genutzt werden.', opts: ['Fakt'], a: 0, why: 'Das steht so im Entwurf und lässt sich nachlesen.' },
        { q: 'Die Strafe von 6 % des Umsatzes ist viel zu hoch.', opts: ['Mischung'], a: 0, why: 'Die Höhe ist ein Fakt. „Viel zu hoch“ ist ein Urteil.' },
        { q: 'Mit 15 ist man reif genug für ein eigenes Konto.', opts: ['Meinung'], a: 0, why: 'Wann jemand „reif genug“ ist, sieht jeder anders.' },
        { q: 'Die Plattform erfährt bei der Altersprüfung nur ein Ja oder Nein, das ist gut für den Datenschutz.', opts: ['Mischung'], a: 0, why: 'Der erste Teil ist ein Fakt aus dem Entwurf. „Gut für den Datenschutz“ ist eine Bewertung.' },
        { q: 'Die Alterskontrolle ist ein Angriff auf die Freiheit im Netz.', opts: ['Meinung'], a: 0, why: 'Das ist eine Bewertung, die manche teilen und andere nicht.' },
        { q: 'Der Rat der EU besteht aus Vertretern der Regierungen.', opts: ['Fakt'], a: 0, why: 'Das lässt sich nachschlagen.' },
        { q: 'Weil Apps Streaks nutzen, sollten sie ganz verboten werden.', opts: ['Mischung'], a: 0, why: 'Dass Apps Streaks nutzen, ist ein Fakt. „Sollten ganz verboten werden“ ist eine Forderung.' },
        { q: 'Eltern sollten über die Kontakte ihrer Kinder entscheiden dürfen.', opts: ['Meinung'], a: 0, why: 'Das ist eine Forderung. Ob sie richtig ist, darüber kann man streiten.' },
        { q: 'Das Europäische Parlament forderte im November 2025 ein Mindestalter von 16 Jahren.', opts: ['Fakt'], a: 0, why: 'Das ist belegt und lässt sich nachprüfen.' }] }),
    T('s2_pack', 'packen', 'Pack deinen Rucksack', 'Wähle vier Argumente, die dich am meisten überzeugen.',

        { t: 'Eltern bekommen Werkzeuge für Kontakte und Zeitlimits.', who: 'Dafür · wird oft von Eltern gesagt', side: 'Dafür', counter: 'Die Gesellschaft für Medienpädagogik (GMK) warnt: Eltern würden von Begleitern zu Kontrolleuren.' },
        { t: 'Hohe Strafen sorgen dafür, dass sich auch große Plattformen an die Regeln halten.', who: 'Dafür · Sicht der Kommission', side: 'Dafür', counter: 'Kritiker sagen, die Kontrollen könnten umgangen werden, wie die Erfahrungen aus Australien zeigen.' },
        { t: 'Die Alterskontrolle betrifft alle Nutzer, auch Erwachsene.', who: 'Dagegen · Sicht von Datenschützern', side: 'Dagegen', counter: 'Die Kommission sagt: Die Plattform erfährt nur „Alter erreicht, ja oder nein“. Dafür soll es eine EU-App geben.' },
        { t: 'Verbote lassen sich umgehen. In Australien nutzten danach noch 81,5 % die Plattformen.', who: 'Dagegen · Sicht von Kritikern', side: 'Dagegen', counter: 'Befürworter sagen: Der EU-Entwurf verlangt mehr als ein eingetipptes Geburtsdatum und verbietet zusätzlich süchtig machende Tricks.' },

        { t: 'Mit einem Verbot lernen Jugendliche nicht, sicher mit Social Media umzugehen.', who: 'Dagegen · Sicht der Schülervertretung', side: 'Dagegen', counter: 'Befürworter sagen: Der gestufte Einstieg mit Mini-Konto ist selbst ein Weg, den Umgang Schritt für Schritt zu lernen.' },
        { t: 'Freunde und Gruppen laufen über soziale Medien. Ohne Konto ist man außen vor.', who: 'Dagegen · Sicht von Jugendlichen', side: 'Dagegen', counter: 'Befürworter sagen: Ab 13 gibt es ein Mini-Konto, und Kontakte kann man mit Erlaubnis der Eltern freigeben.' },
        { t: 'Der Entwurf geht nicht an die Ursache, das Geschäftsmodell der Plattformen.', who: 'Dagegen · Sicht von EDRi', side: 'Dagegen', counter: 'Die Kommission antwortet: Gerade deshalb verbietet der Entwurf auch süchtig machendes Design.' }] }),
    T('s2_free', 'free', 'Schreibwerkstatt', 'Schreibe ein eigenes Argument mit Behauptung, Begründung und Beispiel.',

    if (n >= (d.max || 40)) { c.stopT(); return end(true); }
    t0 = Date.now(); clock();
    if (view === 'feed') { fi++; if (bonus >= 0 && bonus < 3) { bonus++; bon.textContent = bonus < 3 ? '🏅 ' + bonus + '/3' : '🏅 Abzeichen!'; if (bonus === 3) banner(['🏅 Abzeichen „Dauergucker“ freigeschaltet! Nächstes Ziel: 10 Videos.', null]); } render(); }
    else if (view === 'mia') { mi++; render(); }
    if (EV[n]) banner(EV[n]);
  }
  function cdl() { if (!run) return; var left = Math.max(0, W() - (Date.now() - t0)); cd.textContent = (view === 'feed' || view === 'mia') && left < 3200 ? 'Nächstes Video in ' + Math.max(1, Math.ceil(left / 1000)) + ' …' : ''; }
  c.begin = function () { if (run || timer) return; run = true; $q('.closeapp').style.display = ''; say('Die App läuft. Du darfst alles antippen, was dich interessiert. Tippe auf „App schließen“, wenn du aufhören würdest.', 'interested', 5000); t0 = Date.now(); clock(); render(); (function loop() { timer = setTimeout(function () { if (!run) return; tick(); if (run) loop(); }, W()); })(); c.cdt = setInterval(cdl, 250); };
  c.stopT = function () { run = false; clearTimeout(timer); clearInterval(c.cdt); clearInterval(chatT); timer = null; };
  hb.onclick = function () { if (!run) return; likes++; hb.textContent = '❤️'; hb.classList.add('on'); lk.textContent = likes; };
  function end(forced) {
    var min = n * d.vmin + (forced ? 0 : Math.round(d.vmin * Math.min(1, (Date.now() - t0) / W()))), endT = d.start + min; c.stopT();
    if (!forced && n < 2) { say('Das ging sehr schnell, du bist schon nach ' + min + ' Minuten raus. So lernst du nichts über die App. Probiere es noch einmal: Schau zu, tippe an, was dich interessiert, und überlege ehrlich, wann du in einer echten App aufhören würdest.', 'caring', 0); return GAMES.zeitfresser.reset(c, d); }
    var ok = endT < d.deadline, head = endT === d.deadline ? '<b>Du bist genau um ' + hhmm(endT) + ' Uhr raus.</b> Da beginnt dein Training schon, du kommst also zu spät. Die App hat dagegen gearbeitet, dass du rechtzeitig aufhörst.' : ok ? '<b>Du bist um ' + hhmm(endT) + ' Uhr draußen, vor dem Training.</b> Das war nicht selbstverständlich: Die App hat dagegen gearbeitet.' : '<b>Du bist erst um ' + hhmm(endT) + ' Uhr raus, ' + (endT - d.deadline) + ' Minuten nach Trainingsbeginn.</b> Das ist kein persönliches Versagen. Die App ist so gebaut, dass man schwer aufhört.';
    var names = { mia: 'zu Mias Videos', live: 'in Noahs Livestream', snap: 'in den Chat mit Lena', bonus: 'zur Abzeichen-Jagd' }, gone = Object.keys(c.dets).map(function (k) { return names[k]; });
    if (gone.length) head += ' Eine Nachricht hat dich ' + (gone.length === 1 ? gone[0] : gone.slice(0, -1).join(', ') + ' und ' + gone[gone.length - 1]) + ' gelockt.';
    var opts = ['Das nächste Video startete von allein', 'Die Nachrichten oben, die mich gelockt haben', 'Die Serie, die nicht reißen sollte', 'Der Livestream, den ich nicht verpassen wollte', 'Nichts davon, ich wollte einfach weiter'],
      why = ['Das ist Autoplay. Endloses Weiterlaufen ohne echte Pause soll für Minderjährige eingeschränkt werden.', 'Das sind Push-Nachrichten. Solche Nachrichten, die zurückholen, sollen eingeschränkt werden, besonders nachts.', 'Das ist ein Streak. Serien, die bestrafen, wenn man auslässt, sollen für Minderjährige eingeschränkt werden.', 'Ein Livestream läuft nur jetzt. Das Gefühl, etwas zu verpassen, hält einen fest. Auch die Push-Nachricht, die dich hingeholt hat, soll eingeschränkt werden.', 'Auch das ist möglich. Aber Apps sind so gebaut, dass „einfach weiter“ immer der leichteste Weg ist. Deshalb sollen sie wirksame Pausen und Zeitlimits anbieten.'];
    c.pend = { ci: -1, on: function (i) { c.pend = null; c.win('<b>' + esc(opts[i]) + '.</b> ' + why[i] + '<br><br>Der Entwurf will für alle unter 18 solche Tricks einschränken. Außerdem müssen Apps wirksame Pausen und Zeitlimits anbieten, damit nicht nur du allein gegen die App antreten musst.'); } };
    say(head + '<br><br>Was hat dich am ehesten zum Weiterschauen gebracht? Es gibt keine falsche Antwort.', 'interested', 0, opts.map(function (x, i) { return ['o:' + i, x]; }));
  }
  c.sol = function () { return 'Tippe auf „App schließen“, wenn du aufhören willst.'; };
  $q('.closeapp').onclick = function () { if (c.finished || !run) return; end(false); };
  c.auto = function () { c.fast = true; return new Promise(function (res) { var iv = setInterval(function () { if (c.finished) { clearInterval(iv); return res(); } if (!run && !c.pend) { c.onG('go'); } else if (run && n === 1 && view === 'feed' && act) nt.click(); else if (run && n === 3 && view === 'mia') fb.click(); else if (run && n >= 8) $q('.closeapp').click(); else if (c.pend) c.onG('o:' + (n % 5)); }, 120); }); };
  GAMES.zeitfresser.cur = c; clock(); render();
}, reset: function (c, d) { c.stage.innerHTML = ''; c.went = false; c.pend = null; GAMES.zeitfresser.init(c, d); c.waitGo = true; c.addGo(); }, go: function (c) { c.begin(); } };

GAMES.packen = { init: function (c, d) {
  var st = c.stage, picked = [], max = d.max || 3, nudged = false, cards = shuffle(d.args);
  st.innerHTML = '<div class="pcount"></div><div class="pk"></div><div class="row"><button class="btn done">Rucksack abgeben</button></div>';
  var pk = st.querySelector('.pk'), cnt = st.querySelector('.pcount'), done = st.querySelector('.done');
  function upd() { cnt.textContent = '🎒 ' + picked.length + ' von ' + max + ' Argumenten gepackt'; }
  cards.forEach(function (a) { var b = mk('button', 'pcard', esc(a.t) + '<small>' + esc(a.who) + '</small>'); a.el = b; b.onclick = function () { if (c.finished) return; var i = picked.indexOf(a); if (i >= 0) { picked.splice(i, 1); b.classList.remove('in', 'dafuer', 'dagegen'); } else { if (picked.length >= max) return say('Dein Rucksack ist voll. Nimm zuerst ein Argument wieder heraus, indem du es noch einmal antippst.', 'interested', 0); picked.push(a); b.classList.add('in'); } upd(); }; pk.appendChild(b); });
  upd();
  c.sol = function () { return 'Es gibt hier keine falsche Auswahl. Wähle drei Argumente, die dich am meisten überzeugen.'; };
  done.onclick = function () {
    if (c.finished) return; if (picked.length < max) return say('Du hast erst ' + picked.length + ' von ' + max + ' Argumenten gepackt. Wähle die, die dich am meisten überzeugen. Ob dafür oder dagegen, ist deine Entscheidung.', 'interested', 0);
    var sides = {}; picked.forEach(function (a) { sides[a.side] = 1; });
    if (Object.keys(sides).length === 1 && !nudged) { nudged = true; return say('Du hast nur Argumente einer Seite gepackt. Das ist erlaubt. Für eine gute Diskussion lohnt es sich aber, auch ein Argument der anderen Seite zu kennen. Tausche eines aus oder gib den Rucksack so noch einmal ab.', 'thinking', 0); }
    S.pack = picked.map(function (a) { return { t: a.t, who: a.who, side: a.side, counter: a.counter }; });
    picked.forEach(function (a) { a.el.classList.add(a.side === 'Dafür' ? 'dafuer' : 'dagegen'); });
    c.win('Dein Rucksack ist gepackt. Im Reiter 🎒 oben siehst du deine Argumente und, was die Gegenseite dazu sagt. Die Auswahl bleibt bei dir und wird nirgends gespeichert.');
  };
  c.auto = function () { cards.slice(0, max).forEach(function (a) { a.el.click(); }); var s = {}; picked.forEach(function (a) { s[a.side] = 1; }); if (Object.keys(s).length === 1) { var o = cards.filter(function (a) { return !s[a.side]; })[0]; picked[0].el.click(); o.el.click(); } done.click(); return Promise.resolve(); };
} };

/* Waage mit zwei oder drei Schalen */
GAMES.waage = { init: function (c, d) {
  var st = c.stage, cards = shuffle(d.items), sel = null, n = d.sides.length, cnt = []; for (var i = 0; i < n; i++) cnt.push(0);
  st.innerHTML = '<div class="scale"><div class="beam"></div><div class="pans" style="grid-template-columns:repeat(' + n + ',1fr)">' + d.sides.map(function (s, k) { return '<button class="pan" data-s="' + k + '"><b>' + esc(s) + '</b><span class="stack"></span></button>'; }).join('') + '</div></div><div class="hand"></div>';
  var beam = st.querySelector('.beam'), hand = st.querySelector('.hand'), pans = st.querySelectorAll('.pan');
  function tilt() { var a = n > 1 ? Math.max(-14, Math.min(14, (cnt[1] - cnt[0]) * 3)) : 0; beam.style.transform = 'rotate(' + a + 'deg)'; }
  cards.forEach(function (it) { var b = mk('button', 'wcard', esc(it[0])); it.el = b; b.onclick = function () { if (c.finished || it.placed) return; cards.forEach(function (x) { if (x.el) x.el.classList.remove('sel'); }); b.classList.add('sel'); sel = it; }; hand.appendChild(b); });
  pans.forEach(function (p) { p.onclick = function () {
    if (!sel || c.finished) return say('Tippe zuerst eine Karte an, dann die Waagschale.', 'interested', 0); var s = +p.dataset.s, it = sel;
    if (s === it[1]) { it.placed = true; it.el.remove(); cnt[s]++; p.querySelector('.stack').appendChild(mk('i', 'w', '●')); tilt(); sel = null; var left = cards.filter(function (x) { return !x.placed; }).length; if (!left) c.win(esc(it[2]) + ' Alle Karten liegen richtig.'); else c.good(esc(it[2]), 6000); }
    else { it.el.classList.remove('sel'); sel = null; c.bad('Das gehört nicht auf „' + esc(d.sides[s]) + '“. ' + esc(d.hint || 'Überlege noch einmal.')); }
  }; });
  c.sol = function () { return cards.filter(function (x) { return !x.placed; }).map(function (x) { return esc(x[0]) + ' → ' + esc(d.sides[x[1]]); }).join('<br>'); };
  c.auto = function () { return new Promise(function (res) { (function step() { var it = cards.filter(function (x) { return !x.placed; })[0]; if (!it) return res(); it.el.click(); pans[it[1]].click(); setTimeout(step, 100); })(); }); };
} };

/* ===== Was hast du dir gemerkt?: Fragen im Modul, Rückmeldung in der Sprechblase von Herrn Neumann ===== */
function buildProbe() {
  var mc = PROBE.map(function (p) { return { kind: 'mc', ch: p.ch, q: p.q, o: p.o, why: p.why }; });
  var tf = PROBE_TF.map(function (p) { return { kind: 'tf', ch: p.ch, q: p.s, v: p.v, why: p.why }; });
  function pick(pool, n) { var by = {}; shuffle(pool).forEach(function (q) { (by[q.ch] = by[q.ch] || []).push(q); }); var out = [], ids = shuffle(Object.keys(by)); while (out.length < n && ids.length) { ids.forEach(function (k) { if (out.length < n && by[k].length) out.push(by[k].shift()); }); ids = ids.filter(function (k) { return by[k].length; }); } return out; }
  P = { qs: shuffle(pick(mc, 8).concat(pick(tf, 4))), i: 0, ok: 0, wrong: {} };
}
function renderProbe(v) {
  if (!P) buildProbe(); CUR = null;
  v.appendChild(mk('h2', null, '🧠 Was hast du dir gemerkt?')); v.appendChild(mk('p', 'sub', 'Zwölf gemischte Fragen aus allen Teilen. Zurückgehen ist nicht möglich, also lies jede Frage in Ruhe.'));
  if (P.i >= P.qs.length) return renderProbeEnd(v);
  var q = P.qs[P.i], card = mk('div', 'card task'), done = false;
  card.innerHTML = '<div class="pq">Frage ' + (P.i + 1) + ' von ' + P.qs.length + '</div><div class="q">' + (q.kind === 'tf' ? 'Wahr oder falsch?<br><i>' + esc(q.q) + '</i>' : esc(q.q)) + '</div><div class="body"></div><div class="row"></div>';
  var body = card.querySelector('.body'), row = card.querySelector('.row'), opts = q.kind === 'tf' ? [{ x: 'Stimmt', ok: q.v }, { x: 'Stimmt nicht', ok: !q.v }] : shuffle(q.o.map(function (x, i) { return { x: x, ok: i === 0 }; })), box = mk('div', 'opts');
  opts.forEach(function (o) { var b = mk('button', 'opt', esc(o.x)); b.onclick = function () {
    if (done) return; done = true; opts.forEach(function (p) { p.el.disabled = true; if (p.ok) p.el.classList.add('good'); });
    if (o.ok) { P.ok++; say('<b>Richtig.</b> ' + esc(q.why), 'happy', 8000); var bb = B(); if (bb) bb.richtig('probe' + P.i); } else { b.classList.add('bad'); P.wrong[q.ch] = (P.wrong[q.ch] || 0) + 1; say('<b>Nicht ganz.</b> ' + esc(q.why), 'caring', 0); var b2 = B(); if (b2) b2.falsch('probe' + P.i); }
    var n = mk('button', 'btn', P.i + 1 < P.qs.length ? 'Nächste Frage →' : 'Ergebnis ansehen →'); n.onclick = function () { P.i++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }; row.appendChild(n); }; o.el = b; box.appendChild(b); });
  body.appendChild(box); v.appendChild(card);
}
function renderProbeEnd(v) {
  var n = P.qs.length, ok = P.ok, wrong = Object.keys(P.wrong).sort(function (a, b) { return P.wrong[b] - P.wrong[a]; });
  var msg = ok >= 11 ? 'Sehr stark. Du kennst die Grundlagen für die Diskussion.' : ok >= 8 ? 'Das ist solide. Ein Blick in die Merkkästen, dann sitzt es.' : ok >= 5 ? 'Da ist noch Luft nach oben. Das ist in Ordnung, dafür übst du ja.' : 'Das war noch nicht gut. Keine Sorge: Lies die Merkkästen und versuche es dann noch einmal.';
  var c = mk('div', 'card', '<div class="big">' + ok + ' von ' + n + ' richtig</div>');
  if (wrong.length) { c.appendChild(mk('p', null, '<b>Hier lohnt sich eine Wiederholung:</b>')); var ul = mk('ul', 'res'); wrong.forEach(function (id) { var li = mk('li', null, esc(CHI[id].title) + ' (' + P.wrong[id] + (P.wrong[id] === 1 ? ' Fehler' : ' Fehler') + ') '), b = mk('button', 'btn sec', 'Zum Teil'); b.style.cssText = 'padding:5px 12px;font-size:14px'; b.onclick = function () { go(id); }; li.appendChild(b); ul.appendChild(li); }); c.appendChild(ul); } else c.appendChild(mk('p', null, 'Kein einziger Fehler.'));
  var row = mk('div', 'row'), r = mk('button', 'btn', 'Neue Runde mit anderen Fragen'); r.onclick = function () { P = null; render(); window.scrollTo({ top: 0 }); }; row.appendChild(r); c.appendChild(row); v.appendChild(c);
  setTimeout(function () { say('<b>' + ok + ' von ' + n + ' richtig.</b> ' + esc(msg), ok >= 8 ? 'proud' : 'caring', 0); }, 400);
}
function greet() {
  CUR = { onG: function (k) {
    if (k === 'how') say('<b>So funktioniert es:</b> Das Modul hat vier Teile. In Teil 1 und 3 liest du Texte und beantwortest Fragen dazu. In Teil 2 und 4 spielst du Aufgaben, die das Gelesene anders festigen. Auf „Spiel starten“ erkläre ich dir die Regeln, und ich gebe dir Tipps. Wenn du ein Wort nicht kennst, tippe mich an, wähle „Wort erklären“ und <b>markiere das Wort</b>. Dann erkläre ich es dir.', 'interested', 0, [['fin', 'Und die Diskussion?']]);
    else if (k === 'fin') say('Eine „richtige“ Meinung gibt es hier nicht. Die bildest du dir selbst. Vor und nach dem Modul stellt ihr euch in der Klasse auf der Positionierungslinie auf, danach diskutieren wir. Hier sammelst du das Wissen und die Argumente dafür.', 'happy', 0, [['los', 'Los geht’s']]);
    else if (k === 'los') { try { Kolbi.guideEnd(); } catch (e) {} }
  } };
  say('<b>Hallo, ich bin Herr Neumann.</b> Schön, dass du da bist. Es geht um eine Frage, die viele von euch betrifft: Sollen soziale Medien für Jugendliche eingeschränkt werden?', 'happy', 0, [['how', 'Wie funktioniert das hier?']]);
}
function startAll() { tabs(); render(); updateStars(); if (B()) { Begleiter.init({ mode: 'lernen', offsetBottom: 56, aufgabe: 'Wähle einen Teil.', hilfe: 'Beginne mit Teil 1.', tipps: [] }); setTimeout(greet, 500); } }
document.addEventListener('DOMContentLoaded', startAll);

function renderPack(v) {
  CUR = null; v.appendChild(mk('h2', null, '🎒 Dein Rucksack')); v.appendChild(mk('p', 'sub', 'Deine Argumente und was die Gegenseite dazu sagt. Das bleibt bei dir und wird nirgends gespeichert.'));
  if (!S.pack || !S.pack.length) { var e = mk('div', 'card', '<p>Dein Rucksack ist noch leer. In Teil 4 packst du Argumente ein, die dich überzeugen.</p>'); var r = mk('div', 'row'), b = mk('button', 'btn', 'Zu Teil 4'); b.onclick = function () { go('s2'); }; r.appendChild(b); e.appendChild(r); v.appendChild(e); return; }
  S.pack.forEach(function (a) { v.appendChild(mk('div', 'rk ' + (a.side === 'Dafür' ? 'dafuer' : 'dagegen'), '<b>' + esc(a.side) + ':</b> ' + esc(a.t) + '<div class="ge"><b>Die Gegenseite sagt:</b> ' + esc(a.counter) + '</div>')); });
  v.appendChild(mk('div', 'card', '<h3>💬 Fragen für die Diskussion</h3><ul><li>Welches deiner Argumente überzeugt dich am meisten, und warum?</li><li>Welches Gegenargument ist das stärkste?</li><li>Hat sich deine Meinung seit der ersten Positionierungslinie verändert? Was hat den Ausschlag gegeben?</li></ul>'));
  setTimeout(function () { say('Das ist dein Rucksack für die Diskussion. Achte darauf, ob du ein Argument mit <b>Behauptung, Begründung und Beispiel</b> aufbauen kannst.', 'happy', 0); }, 300);
}
