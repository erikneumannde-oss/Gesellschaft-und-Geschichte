<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#14213d">
    <title>Was ist Politik? - Das Spandau-RPG (Module 1-3)</title>
    <style>
        :root {
            --navy: #14213d;
            --navy2: #1f2f55;
            --primary: #12708f;
            --primary-d: #0d5873;
            --accent: #f59e0b;
            --success: #1f9d55;
            --danger: #d64545;
            --ink: #1e293b;
            --paper: #ffffff;
            --soft: #f1f5f9;
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-l: env(safe-area-inset-left, 0px);
            --safe-r: env(safe-area-inset-right, 0px);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--navy);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--ink);
            overflow: hidden;
            overscroll-behavior: none;
        }
        body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

        .ico { display: inline-flex; width: 1.35em; height: 1.35em; vertical-align: -0.28em; flex: none; }
        .ico svg { width: 100%; height: 100%; display: block; }

        /* ---------- Kopfleiste ---------- */
        #hud {
            flex: none; z-index: 6;
            display: flex; align-items: center; gap: 10px;
            padding: calc(8px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));
            background: linear-gradient(180deg, #1b2b52, var(--navy));
            color: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.35);
        }
        #task-card { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; font-size: 15px; line-height: 1.3; }
        #task-card .task-label { flex: none; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #0f172a; background: var(--accent); padding: 3px 8px; border-radius: 999px; }
        #task-display { font-weight: 650; color: #ffe9a8; }
        #task-display .ico { width: 1.5em; height: 1.5em; vertical-align: -0.4em; margin: 0 1px; background: rgba(255,255,255,.92); border-radius: 6px; padding: 2px; }
        #hud-right { flex: none; display: flex; align-items: center; gap: 10px; }
        #phase-display { font-size: 12px; font-weight: 700; background: rgba(255,255,255,.14); padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
        #phone-icon {
            width: 46px; height: 46px; border-radius: 14px; border: 2px solid rgba(255,255,255,.25);
            background: rgba(255,255,255,.1); padding: 7px; cursor: default; opacity: .35; filter: grayscale(1); transition: all .3s;
        }
        #phone-icon .ico { width: 100%; height: 100%; }
        #phone-icon.active { opacity: 1; filter: none; background: var(--accent); border-color: #fff; cursor: pointer; animation: pulse-phone 1.1s infinite alternate; }
        @keyframes pulse-phone { 0% { transform: scale(1); box-shadow: 0 0 0 rgba(245,158,11,0); } 100% { transform: scale(1.1); box-shadow: 0 0 16px rgba(255,214,102,.95); } }

        /* ---------- Spielfläche ---------- */
        #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #4f8f46; }
        #gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

        #power-bar-container {
            position: absolute; top: 10px; right: calc(10px + var(--safe-r)); width: 176px;
            background: rgba(255,255,255,.95); border-radius: 12px; padding: 7px 10px 9px;
            display: none; z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,.25);
        }
        #power-bar-container .pl { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--navy); }
        #power-track { margin-top: 6px; height: 12px; background: #dbe3ec; border-radius: 99px; overflow: hidden; }
        #power-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #38c172, #f6b800); border-radius: 99px; transition: width .5s ease-out; }

        #inventory-bar {
            position: absolute; bottom: calc(12px + var(--safe-b)); left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,.95); padding: 6px 14px; border-radius: 999px;
            display: none; align-items: center; gap: 10px; z-index: 5; font-weight: 800; color: var(--navy);
            font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.25); white-space: nowrap;
        }
        .inv-item { width: 34px; height: 34px; padding: 4px; border-radius: 10px; background: #e2e8f0; opacity: .45; filter: grayscale(.9); transition: all .3s; display: inline-flex; }
        .inv-item .ico { width: 100%; height: 100%; }
        .inv-item.found { opacity: 1; filter: none; background: #fff3c4; box-shadow: 0 0 0 2px var(--accent); transform: scale(1.12); }

        /* Steuerkreuz fürs Handy/Tablet */
        #joy {
            position: absolute; left: calc(16px + var(--safe-l)); bottom: calc(16px + var(--safe-b)); width: 128px; height: 128px; z-index: 5;
            border-radius: 50%; background: rgba(15,23,42,.35); border: 2px solid rgba(255,255,255,.45); display: none; touch-action: none;
            box-shadow: inset 0 0 18px rgba(0,0,0,.3);
        }
        #joy::before { content: ""; position: absolute; inset: 14px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.3); }
        #joy-knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(255,255,255,.88); box-shadow: 0 3px 10px rgba(0,0,0,.35); }
        body.touch #joy { display: block; }
        #hint-tap { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 4; font-size: 12px; font-weight: 700; color: #fff; background: rgba(15,23,42,.6); padding: 5px 12px; border-radius: 999px; pointer-events: none; transition: opacity .8s; }

        /* ---------- Dialoge ---------- */
        #dialog-overlay {
            position: fixed; inset: 0; background: rgba(10,18,36,.72); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
            display: none; justify-content: center; align-items: center; z-index: 20;
            padding: calc(10px + var(--safe-t)) calc(10px + var(--safe-r)) calc(10px + var(--safe-b)) calc(10px + var(--safe-l));
        }
        .dialog-box {
            background: var(--paper); border-radius: 18px; width: 100%; max-width: 620px; max-height: 100%;
            display: flex; flex-direction: column; box-shadow: 0 18px 50px rgba(0,0,0,.5); overflow: hidden;
            animation: pop .22s ease-out;
        }
        @keyframes pop { from { transform: translateY(14px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
        .dialog-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: linear-gradient(135deg, var(--primary), #1b8aa6); color: #fff; }
        #portrait { flex: none; width: 66px; height: 74px; border-radius: 14px; background: rgba(255,255,255,.92); display: none; }
        #dialog-chip { flex: none; width: 46px; height: 46px; border-radius: 14px; background: rgba(255,255,255,.92); padding: 7px; display: none; }
        #dialog-chip .ico { width: 100%; height: 100%; }
        .dialog-head h2 { margin: 0; font-size: 1.12rem; line-height: 1.25; font-weight: 800; }
        .dialog-content-scroll { overflow-y: auto; flex: 1 1 auto; padding: 14px 18px 6px; text-align: left; -webkit-overflow-scrolling: touch; touch-action: pan-y; font-size: 1rem; line-height: 1.5; }
        .dialog-content-scroll p { margin: 0 0 10px; }
        .def-box { background: #eaf4fa; padding: 10px 12px; border-left: 5px solid var(--primary); border-radius: 0 10px 10px 0; margin: 10px 0; font-size: .95rem; }
        .example-box { background: #e7f7ef; padding: 10px 12px; border-left: 5px solid var(--success); border-radius: 0 10px 10px 0; margin: 8px 0; font-size: .95rem; }
        .example-box .ico, .def-box .ico { width: 1.2em; height: 1.2em; }
        .glossar-box { background: #fff8dd; padding: 12px 14px; border: 2px dashed #e0b400; margin: 10px 0; border-radius: 12px; }
        .btn-container { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 10px 18px calc(14px + var(--safe-b) * 0); }
        .btn {
            background: var(--primary); color: #fff; border: none; padding: 13px 18px; min-height: 48px; font: inherit; font-size: 1rem; border-radius: 12px;
            cursor: pointer; font-weight: 800; transition: background .15s, transform .1s; width: 100%; display: block; box-shadow: 0 3px 0 var(--primary-d);
        }
        .btn:hover { background: #1a86a8; } .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--primary-d); }
        #choices-container { display: flex; flex-direction: column; gap: 8px; }
        .choice-btn { background: var(--soft); color: var(--ink); border: 2px solid #cbd5e1; text-align: left; font-size: .95rem; font-weight: 650; padding: 12px 14px; box-shadow: 0 3px 0 #cbd5e1; }
        .choice-btn:hover { background: #e2e8f0; }
        .choice-btn.correct { background: var(--success); color: #fff; border-color: #167a43; box-shadow: 0 3px 0 #0f5c32; }
        .choice-btn.wrong { background: var(--danger); color: #fff; border-color: #a93232; box-shadow: 0 3px 0 #7e2323; opacity: .9; }
        .fb { padding: 9px 12px; border-radius: 10px; font-weight: 700; font-size: .93rem; margin: 6px 0 2px; }
        .fb.bad { background: #fde8e8; color: #9b2c2c; } .fb.ok { background: #def7ea; color: #1b6b3f; }

        .dropzone { display: inline-block; min-width: 108px; min-height: 32px; padding: 2px 10px; background: #e2e8f0; border: 2px dashed #64748b; border-radius: 8px; vertical-align: middle; text-align: center; line-height: 26px; font-weight: 800; color: #334155; margin: 2px 3px; cursor: pointer; }
        .dropzone.filled { background: #d9f2e2; border: 2px solid var(--success); color: #14532d; }
        .drag-items-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding: 10px; background: var(--soft); border-radius: 12px; justify-content: center; }
        .drag-item { background: var(--primary); color: #fff; padding: 9px 13px; min-height: 40px; border-radius: 10px; cursor: pointer; font-size: .92rem; font-weight: 800; user-select: none; -webkit-user-select: none; box-shadow: 0 3px 0 var(--primary-d); display: inline-flex; align-items: center; }
        .drag-item:active { transform: translateY(2px); }
        .drag-item.selected { background: var(--accent); color: #1f1300; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--accent); }

        #impressum { position: fixed; bottom: calc(6px + var(--safe-b)); right: calc(6px + var(--safe-r)); font-size: 11px; color: #334155; background: rgba(255,255,255,.88); padding: 3px 8px; border-radius: 6px; text-decoration: none; z-index: 3; }

        @media (max-width: 560px) {
            #task-card { font-size: 14px; gap: 8px; } #task-card .task-label { display: none; }
            #phase-display { display: none; }
            #power-bar-container { width: 150px; top: 8px; right: 8px; }
            .dialog-box { border-radius: 16px; } .dialog-content-scroll { padding: 12px 14px 4px; } .btn-container { padding: 8px 14px 12px; }
            #impressum { display: none; }
        }
        @media (max-height: 460px) { #hud { padding-top: calc(4px + var(--safe-t)); padding-bottom: 4px; } #task-card { font-size: 13px; } #phone-icon { width: 38px; height: 38px; } #joy { width: 108px; height: 108px; } }
    </style>
  <link rel="icon" type="image/png" href="../../../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../../../icons/apple-touch-icon.png">
</head>
<body>

    <div id="hud">
        <div id="task-card"><span class="task-label">Aufgabe</span><span id="task-display">Schau am Skatepark nach!</span></div>
        <div id="hud-right">
            <button id="phone-icon" type="button" title="Smartphone" aria-label="Smartphone" onclick="triggerSmartphone()"></button>
            <div id="phase-display">Modul 1 / 3</div>
        </div>
    </div>

    <div id="stage">
        <canvas id="gameCanvas" aria-label="Spielkarte von Spandau"></canvas>

        <div id="power-bar-container">
            <div class="pl"><span id="power-ico"></span>Macht (Unterschriften)</div>
            <div id="power-track"><div id="power-bar"></div></div>
        </div>

        <div id="inventory-bar">
            Beweise:
            <span class="inv-item" id="inv-item1" title="Bauplan"></span>
            <span class="inv-item" id="inv-item2" title="Lärm-Studie"></span>
        </div>

        <div id="hint-tap">Tippe auf die Karte oder steuere mit Pfeiltasten/WASD/Steuerkreis</div>
        <div id="joy" aria-label="Steuerkreis"><div id="joy-knob"></div></div>
    </div>

    <div id="dialog-overlay">
        <div class="dialog-box" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
            <div class="dialog-head">
                <canvas id="portrait" width="132" height="148"></canvas>
                <span id="dialog-chip"></span>
                <h2 id="dialog-title">Feierabend in Spandau</h2>
            </div>
            <div class="dialog-content-scroll" id="dialog-scroll-box">
                <div id="dialog-text"></div>
            </div>
            <div class="btn-container">
                <div id="choices-container"></div>
                <button class="btn" id="dialog-btn" type="button" onclick="closeDialog()">Nachschauen gehen!</button>
            </div>
        </div>
    </div>

<script src="art.js"></script>
<script src="game.js"></script>
<a id="impressum" href="../../../impressum.html">Impressum &amp; Datenschutz</a>
<script src="../../../maskottchen/duo-app.js"></script>
</body>
</html>
