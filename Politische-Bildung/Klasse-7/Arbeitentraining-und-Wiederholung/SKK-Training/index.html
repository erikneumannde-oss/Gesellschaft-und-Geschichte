  T('glo_wort', 'wort', 'Wortwolke', 'Baue die Definition der Globalisierung aus der Wortwolke zusammen.',
    'Oben schweben Wörter, darunter steht der Text mit Lücken. Tippe ein Wort an und danach die Lücke, in die es gehört. Ein falsches Wort holst du zurück, indem du seine Lücke noch einmal antippst. Zwei Wörter passen nirgends hinein. Mit „Text prüfen lassen“ lese ich nach.', OLD.glo2.tips, { parts: OLD.glo2.parts, bank: OLD.glo2.bank, win: 'Die Definition steht. Merke dir: Globalisierung hat viele Dimensionen, nicht nur die Wirtschaft.' }),

      { q: 'Schlagzeile: „Weltweiter Konsum lässt Rohstoffe knapp werden.“', opts: ['Umwelt', 'Kultur', 'Kommunikation', 'Wirtschaft'], a: 0, why: 'Massenhafter Konsum und enormer Rohstoffabbau bringen Herausforderungen für die Umwelt.' },

      { q: 'Schlagzeile: „Ein Online-Händler liefert Kleidung aus Asien nach Deutschland.“', opts: ['Wirtschaft', 'Politik', 'Kultur', 'Umwelt'], a: 0, why: 'Weltweiter Handel und Lieferketten gehören zur Dimension Wirtschaft.' },

sma: [
  T('sma_roent', 'roentgen', 'Smartphone-Röntgen', 'Tippe die Bauteile an und beantworte meine Fragen.',
    'Du siehst ein Smartphone von innen. Jedes Bauteil hat eine Nummer. Tippe ein Bauteil an, dann stelle ich dir in meiner Sprechblase eine Frage dazu. Beantworte sie richtig, dann leuchtet das Bauteil grün. Du musst alle sechs Bauteile schaffen.',
    ['Die Platine trägt kleine Bauteile aus Tantal. Das Metall wird aus Coltan gewonnen.', 'Für die Batterie braucht man ein anderes Metall als für die Platine.'],
    { parts: [
      { name: 'Display', r: [82, 22, 136, 68, 0], col: '#9fd6f5', q: 'Auch das Display wird in einem eigenen Schritt hergestellt. Was zeigt das über ein Smartphone?', opts: ['Es entsteht aus vielen Teilen und Schritten', 'Es wird komplett an einem einzigen Ort hergestellt', 'Es braucht nur Rohstoffe, die aus Deutschland stammen'], a: 0, why: 'Ein Smartphone wirkt wie ein Produkt, besteht aber aus vielen Teilen aus vielen Ländern.' },
      { name: 'Kamera', r: [150, 98, 66, 40], col: '#d9c3f2', q: 'Welche Aufgabe hat der Kamera-Sensor?', opts: ['Er nimmt Bilder auf, damit man fotografieren kann', 'Er speichert alle Apps und Fotos dauerhaft auf dem Gerät', 'Er steuert den Stromfluss zwischen Akku und Platine'], a: 0, why: 'Der Bildsensor sorgt dafür, dass das Handy fotografieren kann.' },
      { name: 'Platine', r: [82, 98, 60, 112], col: '#7bc47f', q: 'Auf der Platine stecken sehr kleine Bauteile aus Tantal. Aus welchem Erz wird dieses Metall gewonnen?', opts: ['Aus Coltan', 'Aus Bauxit', 'Aus Eisenerz'], a: 0, why: 'Aus Coltan gewinnt man Tantal. Es wird unter anderem im Osten der Demokratischen Republik Kongo abgebaut.' },
      { name: 'Prozessor', r: [150, 146, 66, 34], col: '#f4a38c', q: 'Wofür ist der Prozessor-Chip da?', opts: ['Er rechnet und steuert alle Abläufe im Gerät', 'Er speichert dauerhaft Fotos, Musik und Apps', 'Er lädt den Akku auf, sobald das Kabel steckt'], a: 0, why: 'Auf winzigen Chips wird gerechnet und gesteuert.' },
      { name: 'Speicher', r: [150, 186, 66, 34], col: '#f7e08a', q: 'Wofür braucht man Speicherchips?', opts: ['Damit Apps und Fotos gespeichert werden', 'Damit das Display bei Sonnenlicht hell leuchtet', 'Damit das Gerät Fotos aufnehmen und scharfstellen kann'], a: 0, why: 'Speicherchips sorgen dafür, dass Apps und Fotos gespeichert werden können.' },
      { name: 'Batterie', r: [82, 226, 136, 68, 0], col: '#b8e0b0', q: 'Welches Metall ist für Smartphone-Batterien wichtig?', opts: ['Lithium', 'Tantal', 'Eisenerz'], a: 0, why: 'Lithium ist wichtig für die Batterien. Tantal steckt dagegen in Bauteilen auf der Platine.' }] }),
  T('sma_band', 'band', 'Das Fließband', 'Tippe die Schritte der Lieferkette in der richtigen Reihenfolge vom Band.',
    'Auf dem Fließband laufen Schritte der Smartphone-Lieferkette vorbei. Tippe immer den Schritt an, der als Nächstes dran ist. Du beginnst bei den Rohstoffen und endest im Laden. Ein falscher Schritt bleibt liegen, und ich sage dir, was davor noch fehlt.',
    ['Ohne Rohstoffe kann nichts hergestellt werden.', 'Erst wenn alle Teile fertig sind, kann das Gerät zusammengebaut werden.'],
    { win: 'Die Lieferkette steht: Abbau, Aufbereitung, Bauteile, Endmontage, Verkauf. Auf jedem Schritt gibt es Risiken.', items: ['Rohstoffe wie Coltan und Lithium abbauen', 'Rohstoffe aufbereiten und reinigen', 'Chips, Displays und Sensoren herstellen', 'Endmontage und Test', 'Verkauf in großen Märkten'], why: ['Am Anfang stehen die Rohstoffe.', 'Die Rohstoffe werden gereinigt und zu brauchbaren Materialien verarbeitet.', 'Aus den Materialien entstehen die Bauteile.', 'Alle Teile werden zusammengebaut und geprüft.', ''] }),
  T('sma_jit', 'jit', 'Just-in-time-Simulator', 'Vergleiche zwei Lager-Strategien und finde heraus, was bei einem Hafenstreik passiert.',
    'Du leitest eine Smartphone-Fabrik. Probiere beide Strategien aus: ein kleines Lager nach dem Just-in-time-Prinzip und ein großes Lager. Drücke bei jeder Strategie auf „Sechs Wochen simulieren“. In Woche 3 und 4 streiken die Hafenarbeiter. Beobachte, was mit der Produktion und den Kosten passiert. Danach stelle ich dir eine Frage.',
    ['Achte auf die roten Wochen und auf die Lagerkosten.', 'Frage dich: Warum würde eine Firma freiwillig das riskantere Lager wählen?'],
    { opts: ['Es spart Lagerkosten', 'Es schützt vor jeder Störung', 'Es verkürzt die Wege der Rohstoffe'], why: 'Wenig Lager spart Geld. Dafür fehlen bei einem Hafenstreik, extremem Wetter oder Konflikten schnell Bauteile.' })
],
kli: [
  T('kli_sim', 'klima', 'Der Treibhaus-Simulator', 'Stelle den Regler für die Treibhausgase ein und beobachte die Temperatur.',
    'Du steuerst die Treibhausgase in der Atmosphäre mit dem Regler. Oben siehst du die Erde und die Temperatur. Ich gebe dir drei Aufgaben nacheinander in meiner Sprechblase. Stelle den Regler ein und gib die Einstellung ab. Beobachte, was mit den Wärmepfeilen und der Temperatur passiert.',
    ['Die Mitte des Reglers ist der natürliche Zustand der Erde.', 'Die Temperatur, die du suchst, steht in der Anzeige. Schiebe langsam und beobachte.'],
    { steps: [
      { task: 'Stelle den Regler so ein, dass es <b>gar keine Treibhausgase</b> gibt. Gib die Einstellung dann ab.', ok: function (v) { return v <= 5; }, set: 0, why: 'Ohne Treibhausgase fehlt das schützende Glasdach. Die Wärme entweicht ins Weltall, die Erde würde auf etwa −18 °C auskühlen. Leben wäre kaum möglich.', no: 'Das ist noch nicht ganz ohne Treibhausgase. Schiebe den Regler ganz nach links.', sol: 'Schiebe den Regler ganz nach links, bis keine Gase mehr da sind.' },
      { task: 'Jetzt der <b>natürliche Treibhauseffekt</b>: Stelle den Regler so ein, dass die Erde im Durchschnitt <b>15 °C</b> hat.', ok: function (v) { return v >= 95 && v <= 105; }, set: 100, why: 'Der natürliche Treibhauseffekt hebt die Durchschnittstemperatur auf ideale 15 °C. Wir sind auf ihn angewiesen.', no: 'Das sind noch nicht 15 °C. Beobachte die Temperaturanzeige und stelle den Regler in die Mitte.', sol: 'Der Regler steht in der Mitte, bei der Markierung „natürlich“.' },
      { task: 'Nun der Mensch: Fabriken, fossile Energien und Abholzung bringen immer mehr Treibhausgase in die Luft. Schiebe den Regler <b>ganz nach rechts</b> und gib die Einstellung ab.', ok: function (v) { return v >= 195; }, set: 200, why: 'Das Glasdach wird zu dick: Es bleibt viel Wärme in der Atmosphäre. Bis 2100 könnte die Temperatur um etwa 4 °C steigen. Eis schmilzt, der Meeresspiegel steigt, und Extremwetter nimmt zu.', no: 'Noch nicht genug. Schiebe den Regler weiter nach rechts.', sol: 'Den Regler bis ganz rechts schieben.' }] }),
  T('kli_mem', 'memory', 'Folgen-Memory', 'Finde die Paare aus Region und Folge des Klimawandels.',
    'Du siehst acht verdeckte Karten. Decke immer zwei auf. Gehören sie zusammen, bleiben sie offen: eine Region und die passende Folge des Klimawandels. Wenn nicht, drehen sie sich wieder um. Merke dir, wo was liegt. Bei jedem Paar sage ich dir etwas dazu.',
    ['Es sind vier Regionen oder Themen und vier Folgen.', 'Schau in den Merkkasten, wenn du unsicher bist, welche Folge zu welcher Region gehört.'],
    { pairs: [['Arktis', 'Das Eis schmilzt, Eisbären verlieren ihren Lebensraum', 'In der Arktis schmilzt das Eis rasant. Eisbären sind auf das Packeis angewiesen, um Robben zu jagen.'], ['Ozeanien', 'Korallen sterben, flache Inseln drohen zu versinken', 'In Ozeanien erwärmen sich die Meere. Am Great Barrier Reef sterben Korallen, und flache Pazifik-Inseln drohen im Meer zu versinken.'], ['Europa', 'Im Norden Überschwemmungen, im Süden Dürren', 'In Europa ist die Lage zweigeteilt: Im Norden drohen Überschwemmungen, im Süden Dürren und Waldbrände.'], ['Golfstrom', 'Warme Meeresströmung gerät aus dem Gleichgewicht', 'Der Golfstrom gerät durch die Eisschmelze aus dem Gleichgewicht. Das verändert das Klima in Nord- und Westeuropa.']] }),
  T('kli_free', 'free', 'Schreibwerkstatt', 'Erkläre den Unterschied zwischen natürlichem Treibhauseffekt und Klimawandel.',
    'Jetzt schreibst du selbst. Erkläre in zwei bis drei Sätzen den Unterschied zwischen dem natürlichen Treibhauseffekt und dem menschengemachten Klimawandel. Ich lese mit und prüfe, ob beide Seiten vorkommen.', OLD.kli6.tips, { min: OLD.kli6.min, need: OLD.kli6.need, groups: OLD.kli6.groups, sample: OLD.kli6.sample })
],
fuss: [
  T('fuss_lampen', 'lampen', 'Die drei Lampen der Nachhaltigkeit', 'Finde heraus, welche Seite der Nachhaltigkeit zu kurz kommt.',
    'Nachhaltigkeit hat drei Seiten: Umwelt, Soziales und Wirtschaft. Unter jeder Situation leuchtet eine Lampe pro Seite. Tippe die Lampe der Seite an, die in der Situation zu kurz kommt. Wenn du falsch liegst, sage ich dir, worauf du achten musst.',
    ['Frage dich: Wer oder was leidet unter dieser Situation, die Natur, die Menschen oder der Betrieb?', 'Zur Wirtschaft gehört auch, dass ein Betrieb auf Dauer bestehen kann.'],
    { sides: ['Umwelt', 'Soziales', 'Wirtschaft'], scenes: [['Eine große Fangflotte fischt ein Gebiet leer und zieht weiter.', 0, 'Leergefischte Meere gehen auf Kosten der Umwelt und der Zukunft.'], ['Kleidung ist so billig, dass Näherinnen kaum davon leben können.', 1, 'Hier kommt das Soziale zu kurz: Menschen können von ihrer Arbeit nicht leben.'], ['Eine Bäckerei arbeitet so umweltfreundlich und fair, dass sie ihre Kosten nie deckt und schließen muss.', 2, 'Auch die Wirtschaft muss tragfähig sein. Ein Betrieb, der dauerhaft draufzahlt, hält nicht durch.'], ['Ein Kraftwerk liefert sehr günstigen Strom, stößt aber enorm viel CO₂ aus.', 0, 'Günstiger Strom nützt wenig, wenn die Umwelt dafür leidet.'], ['Ein Unternehmen spart Kosten, indem es seine Beschäftigten kaum bezahlt.', 1, 'Hier wird am Sozialen gespart. Faire Bezahlung gehört zu einer nachhaltigen Wirtschaft.']] }),
  T('fuss_zeit', 'zeit', 'Zeitstrahl', 'Ordne die drei Ereignisse dem richtigen Jahr auf dem Zeitstrahl zu.',
    'Auf dem Zeitstrahl stehen drei Jahreszahlen. Darunter liegen Karten mit Ereignissen zur Nachhaltigkeit. Tippe eine Karte an und danach das Jahr, in dem das Ereignis stattfand. Bei jedem richtigen Treffer erkläre ich dir kurz den Hintergrund.',
    ['Das Wort „nachhaltig“ kommt aus der Forstwirtschaft und ist sehr alt.', 'Der Erdüberlastungstag, den du aus dem Merkkasten kennst, ist das jüngste Ereignis.'],
    { events: [['1713', 'Carlowitz fordert, nur so viel Holz zu schlagen, wie nachwachsen kann', 'Hans Carl von Carlowitz sah 1713, dass das Holz knapp wurde. Daher kommt das Wort „nachhaltig“.'], ['1987', 'Der Brundtland-Bericht der Vereinten Nationen erscheint', 'Im Brundtland-Bericht von 1987 steht: Eine Entwicklung ist nachhaltig, wenn spätere Generationen nicht schlechter leben müssen.'], ['2026', 'Erdüberlastungstag Deutschlands am 10. Mai', 'Für Deutschland lag der Erdüberlastungstag 2026 am 10. Mai. Ab diesem Tag wird mehr verbraucht, als die Erde im Jahr nachliefert.']] }),
  T('fuss_par', 'parcours', 'Der Alltags-Parcours', 'Triff vier Entscheidungen im Alltag und senke deinen Fußabdruck.',
    'Du erlebst vier Alltagssituationen. In jeder wählst du zwischen zwei Möglichkeiten. Tippe die nachhaltigere an. Der Fußabdruck-Meter oben sinkt nur im Spiel, er ist keine Messung. Bei jeder Wahl sage ich dir, warum.',

      { q: 'Ein altes Haus steht leer und soll genutzt werden.', good: 'Das Haus umbauen', bad: 'Das Haus abreißen und neu bauen', why: 'Alte Häuser umzubauen statt neu zu bauen spart Material und Energie, denn das Haus steht ja schon.', nope: 'Abreißen und neu bauen braucht viele neue Rohstoffe. Überlege, was nachhaltiger ist.' },
      { q: 'Dein Handy läuft noch gut, aber ein neues Modell erscheint.', good: 'Das Handy weiter benutzen', bad: 'Das neue Modell kaufen', why: 'Für ein Smartphone werden Rohstoffe wie Coltan und Lithium abgebaut und über weite Wege transportiert. Je länger du es nutzt, desto besser.', nope: 'Ein neues Smartphone bedeutet wieder Rohstoffabbau und Transport. Überlege, was nachhaltiger ist.' },
      { q: 'Vom Mittagessen bleibt etwas übrig.', good: 'Aufheben und später essen', bad: 'In den Müll werfen', why: 'In jedem Essen stecken Fläche, Wasser und Energie. Wer Reste verwertet, verschwendet nichts.', nope: 'Weggeworfenes Essen war umsonst erzeugt. Überlege, was nachhaltiger ist.' }] })

kar: [
  T('kar_steck', 'steckbrief', 'Der Steckbrief', 'Fülle den Steckbrief für die Einleitung der Karikaturanalyse aus.',
    'Die Karikatur „Schnäppchenjagd“ ist neu für dich. Die Einleitung braucht fünf Angaben: Titel, Jahr, Zeichner, Veröffentlichungsort und Thema. Die meisten stehen unter dem Bild. Wähle in jedem Feld die passende Angabe. Achtung: Der Text in der Sprechblase ist nicht der Titel, und das Thema steht nirgends.',
    ['Die formalen Angaben stehen unter dem Bild, der Titel in Anführungszeichen.', 'Das Thema erkennst du an den Bildelementen: Smartphone, Fabrik, Mine und Elektroschrott.'],
    { fields: [{ l: 'Titel', o: ['„Schnäppchenjagd“', '„So günstig!“', '„Der Eisberg“'], note: 'Der Titel steht unter dem Bild in Anführungszeichen. Der Text in der Sprechblase ist nicht der Titel.' }, { l: 'Jahr', o: ['2026', '2004', '1989'], note: 'Das Jahr steht unter dem Bild.' }, { l: 'Zeichner', o: ['N. N.', 'Erika Muster', 'Karl Beispiel'], note: 'Der Zeichner steht unter dem Bild.' }, { l: 'Veröffentlichungsort', o: ['Tageszeitung', 'Schulbuch', 'Wetterbericht'], note: 'Der Veröffentlichungsort steht unter dem Bild.' }, { l: 'Thema', o: ['Smartphone-Produktion', 'Urlaub am Meer', 'Wetter im Winter'], note: 'Das Thema steht nirgends. Du erschließt es aus den Bildelementen: Smartphone, Fabrik, Mine und Schrott.' }] }),
  T('kar_duell', 'duell', 'Das Beschreibungs-Duell', 'Beschreibung, Deutung oder Wertung? Ordne Aussagen zur Karikatur zu.',
    'Im Spiel stehen sechs Aussagen zur Karikatur. Entscheide per Tipp, ob sie eine Beschreibung, eine Deutung oder eine Wertung sind. Eine Beschreibung sagt sachlich, was zu sehen ist. Eine Deutung sagt, was es bedeutet. Eine Wertung ist deine Meinung. Bei einem Fehler erkläre ich dir den Unterschied.',
    ['Beschreibung: Das könntest du auch einem Blinden vorlesen.', '„Steht für“ und „bedeutet“ verraten die Deutung, „ich finde“ verrät die Wertung.'],
    { n: 6, fixed: ['Beschreibung', 'Deutung', 'Wertung'], defs: { 'Beschreibung': 'Eine Beschreibung sagt nur sachlich, was im Bild zu sehen ist.', 'Deutung': 'Eine Deutung sagt, wofür ein Bildelement steht oder was es bedeutet.', 'Wertung': 'Eine Wertung ist eine eigene Meinung, zum Beispiel ob die Karikatur überzeugend ist.' }, win: 'Du hältst Beschreibung, Deutung und Wertung sauber auseinander. Das ist der häufigste Fehler in Karikaturanalysen.', qs: [
      { q: '„Auf der Spitze des Eisbergs steht ein lachender Mann und hält ein Smartphone hoch.“', opts: ['Beschreibung', 'Deutung', 'Wertung'], a: 0, why: 'Das ist eine sachliche Beschreibung: Man sieht es einfach im Bild.' },
      { q: '„Der Eisberg steht dafür, dass man nur einen kleinen Teil des Problems sieht.“', opts: ['Deutung', 'Beschreibung', 'Wertung'], a: 0, why: 'Das ist eine Deutung: Es geht darum, wofür ein Bildelement steht.' },
      { q: '„Ich finde, der Zeichner übertreibt hier viel zu stark.“', opts: ['Wertung', 'Beschreibung', 'Deutung'], a: 0, why: 'Das ist eine Wertung: „Ich finde“ zeigt deine Meinung. Sie gehört in den Schluss.' },
      { q: '„Unter Wasser liegen im Eisberg drei Räume übereinander.“', opts: ['Beschreibung', 'Deutung', 'Wertung'], a: 0, why: 'Das ist eine Beschreibung: Man kann nachzählen, was zu sehen ist.' },
      { q: '„Die gebeugten Arbeiter stehen für harte Arbeitsbedingungen.“', opts: ['Deutung', 'Beschreibung', 'Wertung'], a: 0, why: 'Das ist eine Deutung: „Stehen für“ zeigt, dass etwas gedeutet wird.' },
      { q: '„Rechts im Bild fährt ein Containerschiff, aus dessen Schornstein eine Wolke mit der Aufschrift CO₂ aufsteigt.“', opts: ['Beschreibung', 'Deutung', 'Wertung'], a: 0, why: 'Das ist eine Beschreibung: Man sieht es im Bild, es wird nichts erklärt oder bewertet.' },
      { q: '„Der Mann an der Spitze ruft „So günstig!“ und hält ein Preisschild mit „nur 99 €“ neben sein Smartphone.“', opts: ['Beschreibung', 'Deutung', 'Wertung'], a: 0, why: 'Das ist eine Beschreibung: Es steht nur da, was zu sehen und zu lesen ist.' },
      { q: '„Das Containerschiff mit der CO₂-Wolke steht für die Umweltbelastung durch den weltweiten Transport.“', opts: ['Deutung', 'Beschreibung', 'Wertung'], a: 0, why: 'Das ist eine Deutung: Ein Bildelement wird erklärt.' },
      { q: '„Der Elektroschrott ganz unten zeigt, dass die Lieferkette am Ende als Müll endet.“', opts: ['Deutung', 'Beschreibung', 'Wertung'], a: 0, why: 'Das ist eine Deutung: Es wird gesagt, was das Bildelement bedeutet.' },
      { q: '„Ich halte die Idee mit dem Eisberg für sehr treffend gewählt.“', opts: ['Wertung', 'Beschreibung', 'Deutung'], a: 0, why: 'Das ist eine Wertung: „Ich halte“ zeigt eine eigene Meinung.' },
      { q: '„Meiner Meinung nach zeigt die Karikatur das Problem zu einseitig.“', opts: ['Wertung', 'Beschreibung', 'Deutung'], a: 0, why: 'Das ist eine Wertung: „Meiner Meinung nach“ kennzeichnet ein eigenes Urteil.' },
