<!doctype html>

<head>

<link rel="apple-touch-icon" href="../../../../icons/apple-touch-icon.png">
<style>
:root{--board:#2f4b3f;--board2:#3a5a4c;--chalk:#f6f3e8;--frame:#8a5d3b;--paper:#fffdf6;--ink:#26303a;--muted:#667380;--line:#dcd5c0;--gold:#e0a63a;--gold-d:#b9801c;--ok:#2e8b57;--bad:#c0392b;--blue:#386fa4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,Roboto,Tahoma,sans-serif;line-height:1.5;background-color:#f3efe0;
 background-image:linear-gradient(rgba(70,120,170,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(70,120,170,.13) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:880px;margin:0 auto;padding:10px 12px 220px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px}
.back{background:#7d8a86;color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:8px 14px;border-radius:8px}
.stars{background:var(--paper);border:2px solid var(--gold);color:var(--gold-d);font-weight:800;border-radius:999px;padding:5px 13px;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.tafel{background:radial-gradient(ellipse at 30% 20%,var(--board2),var(--board));color:var(--chalk);border:9px solid var(--frame);border-radius:10px;padding:16px 16px 14px;text-align:center;box-shadow:0 8px 20px rgba(60,40,20,.3),inset 0 0 40px rgba(0,0,0,.25);position:relative}
.tafel h1{margin:0;font-size:clamp(21px,5.2vw,31px);line-height:1.2;letter-spacing:.3px;text-shadow:0 0 1px rgba(255,255,255,.4)}
.tafel p{margin:6px 0 0;font-size:14.5px;opacity:.92}
.tafel .kreide{position:absolute;left:14px;bottom:-9px;width:46px;height:9px;background:#f4efe0;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.3)}
nav#tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;padding:10px 2px 8px;margin-top:8px;background:linear-gradient(#f3efe0 75%,rgba(243,239,224,0));-webkit-overflow-scrolling:touch}
nav#tabs button{flex:none;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:14px;font-weight:700;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav#tabs button.on{background:var(--board);border-color:var(--board);color:var(--chalk)}
nav#tabs button.fin::after{content:' ✓';color:var(--ok)} nav#tabs button.on.fin::after{color:#9be0b4}
h2{font-size:clamp(20px,4.6vw,25px);margin:12px 0 4px}
.sub{color:var(--muted);margin:0 0 8px;font-size:14.5px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin:12px 0;box-shadow:0 3px 8px rgba(80,60,20,.08)}
.merk{background:#fff8dc;border:1px solid #ecd98a;border-left:7px solid var(--gold)}
.merk h3{margin:0 0 6px;font-size:17px} .merk ul{margin:0;padding-left:20px} .merk li{margin:6px 0}
.hello{display:flex;gap:12px;align-items:flex-start;background:#eef6f0;border:1px solid #bcd8c6;border-left:7px solid var(--board)}
.hello .em{font-size:34px;line-height:1}
.hello p{margin:0 0 6px} .hello p:last-child{margin:0}
.chap{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));margin:10px 0}
.chap button{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:13px;font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 3px 8px rgba(80,60,20,.08)}
.chap button:hover{border-color:var(--gold)} .chap b{display:block;font-size:16.5px;margin-bottom:2px}
.chap .s{display:block;font-size:13.5px;color:var(--muted);margin-bottom:7px} .chap .ic{font-size:26px;float:right;margin-left:8px}
.pbar{height:9px;background:#e8e2cf;border-radius:6px;overflow:hidden} .pbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.cnt{font-size:12.5px;color:var(--muted);margin-top:4px;display:block}
.task .head{display:flex;gap:10px;align-items:flex-start}
.task .nr{flex:none;background:var(--board);color:var(--chalk);font-weight:800;font-size:14px;border-radius:8px;padding:3px 10px;margin-top:1px}
.task.done .nr{background:var(--ok)} .task.done{border-color:#b9dcc6}
.task .q{font-weight:600} .task .body{margin-top:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{background:var(--board);color:var(--chalk);border:0;border-radius:9px;padding:11px 17px;font:inherit;font-size:15.5px;font-weight:700;cursor:pointer}
.btn:hover{background:#264035} .btn:disabled{background:#b8b4a4;cursor:not-allowed}
.btn.tip{background:var(--gold);color:#3c2a06} .btn.tip:hover{background:var(--gold-d);color:#fff}
.btn.sec{background:#ece6d2;color:var(--ink);border:1px solid var(--line)} .btn.sec:hover{background:#e2dcc6}
.fb{margin-top:10px;padding:10px 12px;border-radius:9px;font-size:15px;display:none}
.fb.show{display:block} .fb.ok{background:#e8f5ed;border:1px solid #a9d9bb} .fb.no{background:#fdecea;border:1px solid #f0b8b2} .fb.neutral{background:#f3efe2;border:1px solid var(--line)}
.fb b.nm{color:var(--board)}
.loesung{display:none;margin-top:10px;background:#f2edfa;border-left:6px solid #8a5fb4;border-radius:9px;padding:10px 14px;font-size:15px}
.loesung.show{display:block} .loesung p{margin:4px 0}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:#fff;border:2px solid #d8d2bd;border-radius:10px;padding:10px 12px;font:inherit;font-size:15.5px;color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--gold)} .opt.sel{border-color:var(--blue);background:#eaf2fb} .opt.good{border-color:var(--ok);background:#e8f5ed} .opt.bad{border-color:var(--bad);background:#fdecea}
.mrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding:9px 6px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0} .mrow .t{flex:1 1 230px}
.mrow.good{background:#eef8f1} .mrow.bad{background:#fdf1ef}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid #cfc8b0;border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;font:inherit;font-size:14.5px;padding:8px 12px;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:2px solid #cfc8b0} .seg button.sel{background:var(--blue);color:#fff}
.why{flex-basis:100%;font-size:14px;color:#3d4b57;margin:2px 0 0}
select{font:inherit;font-size:16px;padding:7px 8px;border:2px solid #c9c2a8;border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
select.good{border-color:var(--ok);background:#e8f5ed} select.bad{border-color:var(--bad);background:#fdecea}
.pair{display:grid;gap:6px;padding:9px 0;border-bottom:1px solid var(--line)} .pair:last-child{border-bottom:0} .pair b{font-size:15.5px}
.pair select{width:100%} .pair.good{background:#eef8f1} .pair.bad{background:#fdf1ef}
.cl{line-height:2.4}
.cl select{margin:0 3px;max-width:58vw}
.ordwrap h4{margin:8px 0 4px;font-size:13.5px;color:var(--muted)}
.pool,.seq{display:grid;gap:6px} .seq{counter-reset:s;min-height:46px;border:2px dashed #cfc8b0;border-radius:10px;padding:6px}
.ocard{text-align:left;background:#fff;border:2px solid #d8d2bd;border-radius:10px;padding:9px 12px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.seq .ocard{border-color:var(--blue);background:#eaf2fb} .seq .ocard::before{counter-increment:s;content:counter(s) '. ';font-weight:800;color:var(--blue)}
.seq .ocard.good{border-color:var(--ok);background:#e8f5ed} .seq .ocard.bad{border-color:var(--bad);background:#fdecea}
textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:2px solid #cfc8b0;border-radius:10px;resize:vertical;min-height:110px;background:#fff;color:var(--ink)}
.count{font-size:12.5px;color:var(--muted);text-align:right;margin-top:2px}
.fig{margin:6px 0 4px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line);background:#faf7ea}
.spotbox{position:relative;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.spotbox svg{pointer-events:none}
.ping{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;animation:ping .8s ease-out forwards}
.ping.ok{border:4px solid var(--ok);background:rgba(46,139,87,.22)} .ping.no{border:4px solid var(--bad);background:rgba(192,57,43,.18)}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.3);opacity:0}}
.rect{position:absolute;border:3px solid var(--ok);background:rgba(46,139,87,.16);border-radius:8px;pointer-events:none}
.spotq{font-weight:800;color:var(--board);margin:6px 0}
.hint{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.badge{display:inline-block;background:var(--gold);color:#3c2a06;font-weight:800;border-radius:999px;padding:3px 12px;font-size:13.5px;margin-left:6px;vertical-align:middle}
.pq{font-size:17px;font-weight:700;margin:4px 0 10px}
.big{font-size:34px;font-weight:800;color:var(--board)}
.res li{margin:6px 0}
.foot{margin:26px 0 0;text-align:center}.impressum{color:#555;font-size:12.5px}
.card{scroll-margin-top:72px}
@media (max-width:480px){.card{padding:12px}.wrap{padding-left:8px;padding-right:8px}}
@media (orientation:landscape) and (max-width:1000px){.wrap{padding-right:96px}}
@media (prefers-reduced-motion:reduce){.ping{animation-duration:.01s}}
</style>

var W_TYPES = {};

/* --- Multiple Choice --- */
W_TYPES.mc = function (t, card, body) {
  var opts = shuffle(t.o.map(function (x, i) { return { x: x, ok: i === 0 }; })), sel = null, box = mk('div', 'opts');
  opts.forEach(function (o) {
    var b = mk('button', 'opt', esc(o.x)); o.el = b;
    b.onclick = function () { if (b.classList.contains('bad') || card.classList.contains('done')) return; opts.forEach(function (p) { p.el.classList.remove('sel'); }); b.classList.add('sel'); sel = o; };
    box.appendChild(b);
  });
  body.appendChild(box);
  return {
    check: function () {
      if (card.classList.contains('done')) return null;
      if (!sel) return { ok: false, skip: true, msg: 'Wähle zuerst eine Antwort aus.' };
      if (sel.ok) { sel.el.classList.remove('sel'); sel.el.classList.add('good'); return { ok: true, msg: t.why }; }
      sel.el.classList.remove('sel'); sel.el.classList.add('bad'); sel = null;
      return { ok: false, msg: 'Das stimmt nicht. Die rot markierte Antwort fällt weg. Lies die Frage noch einmal.' };
    },
    solution: function () { return '<p><b>Richtige Antwort:</b> ' + esc(t.o[0]) + '</p><p>' + esc(t.why) + '</p>'; },
    reveal: function () { opts.forEach(function (o) { if (o.ok) o.el.classList.add('good'); }); }
  };
};

/* --- Zeilen mit Auswahlknöpfen (Sortieren, Wahr/Falsch) --- */
function rowsWidget(t, card, body, cats, items) {
  var rows = shuffle(items.map(function (it) { return { text: it[0], c: it[1], why: it[2] || null, v: null }; }));
  rows.forEach(function (r) {
    var el = mk('div', 'mrow'), tx = mk('div', 't', esc(r.text)), seg = mk('div', 'seg');
    cats.forEach(function (name, ci) { var b = mk('button', null, esc(name)); b.onclick = function () { if (card.classList.contains('done')) return; r.v = ci; [].forEach.call(seg.children, function (x, k) { x.classList.toggle('sel', k === ci); }); el.className = 'mrow'; }; seg.appendChild(b); });
    el.appendChild(tx); el.appendChild(seg); r.el = el; body.appendChild(el);
  });
  function explain(r) { if (r.why && !r.el.querySelector('.why')) r.el.appendChild(mk('div', 'why', '→ ' + esc(r.why))); }
  return {
    check: function () {

      var bad = 0; rows.forEach(function (r) { var ok = r.v === r.c; r.el.className = 'mrow ' + (ok ? 'good' : 'bad'); if (!ok) bad++; });

    },
    solution: function () { return rows.map(function (r) { return '<p><b>' + esc(r.text) + '</b><br>→ ' + esc(cats[r.c]) + (r.why ? ' · ' + esc(r.why) : '') + '</p>'; }).join(''); },
    reveal: function () { rows.forEach(function (r) { r.el.className = 'mrow good'; [].forEach.call(r.el.querySelectorAll('.seg button'), function (x, k) { x.classList.toggle('sel', k === r.c); }); }); }
  };
}
W_TYPES.sort = function (t, card, body) { return rowsWidget(t, card, body, t.cats, t.items); };
W_TYPES.tf = function (t, card, body) { return rowsWidget(t, card, body, ['Stimmt', 'Stimmt nicht'], t.items.map(function (it) { return [it[0], it[1] ? 0 : 1, it[2]]; })); };

/* --- Zuordnen per Auswahlfeld --- */
W_TYPES.match = function (t, card, body) {
  var defs = shuffle(t.rows.map(function (r) { return r[1]; }).concat(t.extra || [])), sels = [];
  t.rows.forEach(function (r) {
    var p = mk('div', 'pair', '<b>' + esc(r[0]) + '</b>'), s = mk('select');

    check: function () {

      return bad ? { ok: false, msg: (bad === 1 ? 'Eine Lücke ist noch falsch (rot).' : bad + ' Lücken sind noch falsch (rot).') + ' Lies den Satz noch einmal im Ganzen.' } : { ok: true, msg: 'Alle Lücken stimmen.' };
    },
    solution: function () { return '<p>' + t.parts.map(function (p) { return typeof p === 'string' ? esc(p) : '<b>' + esc(p.a) + '</b>'; }).join('') + '</p>'; },
    reveal: function () { sels.forEach(function (x) { x.s.value = x.a; x.s.className = 'good'; }); }
  };
};

/* --- Reihenfolge --- */
W_TYPES.order = function (t, card, body) {
  var items = t.items.map(function (x, i) { return { x: x, i: i }; }), pool = mk('div', 'pool'), seq = mk('div', 'seq'), picked = [];
  var wrap = mk('div', 'ordwrap'); wrap.appendChild(mk('h4', null, 'Zur Auswahl (antippen):')); wrap.appendChild(pool); wrap.appendChild(mk('h4', null, 'Deine Reihenfolge (zum Entfernen antippen):')); wrap.appendChild(seq); body.appendChild(wrap);
  var order = shuffle(items);
  function draw() {
    pool.innerHTML = ''; seq.innerHTML = '';
    order.filter(function (o) { return picked.indexOf(o) < 0; }).forEach(function (o) { var b = mk('button', 'ocard', esc(o.x)); b.onclick = function () { if (card.classList.contains('done')) return; picked.push(o); draw(); }; pool.appendChild(b); });
    picked.forEach(function (o) { var b = mk('button', 'ocard', esc(o.x)); o.el = b; b.onclick = function () { if (card.classList.contains('done')) return; picked.splice(picked.indexOf(o), 1); draw(); }; seq.appendChild(b); });
  }
  draw();
  return {
    check: function () {
      if (card.classList.contains('done')) return null;
      if (picked.length < items.length) return { ok: false, skip: true, msg: 'Es fehlen noch Schritte in deiner Reihenfolge.' };
      var bad = 0; picked.forEach(function (o, k) { var ok = o.i === k; o.el.classList.add(ok ? 'good' : 'bad'); if (!ok) bad++; });
      return bad ? { ok: false, msg: 'Die rot markierten Schritte stehen noch an der falschen Stelle. Tippe sie an, um sie zu entfernen, und setze sie neu.' } : { ok: true, msg: t.why };
    },
    solution: function () { return '<ol>' + t.items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>'; },
    reveal: function () { picked = items.slice(); draw(); picked.forEach(function (o) { o.el.classList.add('good'); }); }
  };
};

/* --- Freitext: Herr Neumann prüft anhand von Stichwort-Gruppen --- */
W_TYPES.free = function (t, card, body) {
  var ta = mk('textarea'); ta.placeholder = 'Schreibe hier in ganzen Sätzen …'; ta.setAttribute('aria-label', 'Deine Antwort');
  var cnt = mk('div', 'count', '0 Zeichen'); ta.oninput = function () { cnt.textContent = ta.value.trim().length + ' Zeichen (mindestens ' + t.min + ')'; };
  body.appendChild(ta); body.appendChild(cnt);
  body.appendChild(mk('p', 'hint', 'Herr Neumann prüft, ob die wichtigen Punkte vorkommen. Er achtet auf deine Wörter, nicht auf die Rechtschreibung.'));
  return {
    check: function () {
      if (card.classList.contains('done')) return null;
      var x = ta.value.trim(), words = x.split(/\s+/).filter(Boolean), uniq = {}; words.forEach(function (w) { uniq[w.toLowerCase()] = 1; });
      if (!x) return { ok: false, skip: true, msg: 'Du hast noch nichts geschrieben. Versuch es, ein falscher Anfang ist besser als gar keiner.' };
      if (x.length < t.min || words.length < 8) return { ok: false, skip: true, msg: 'Das ist mir noch zu knapp. Schreibe in ganzen Sätzen und erkläre etwas mehr (mindestens ' + t.min + ' Zeichen, du hast ' + x.length + ').' };
      if (Object.keys(uniq).length < words.length * 0.55) return { ok: false, msg: 'Das sieht nach Wiederholungen aus. Schreibe bitte eine ernsthafte Antwort in eigenen Worten.' };
      var hit = t.groups.filter(function (g) { return g.rx.test(x); }), miss = t.groups.filter(function (g) { return !g.rx.test(x); });
      if (hit.length >= t.need) {
        var more = miss.length ? ' Noch stärker wäre die Antwort mit: ' + miss.map(function (g) { return esc(g.label); }).join('; ') + '.' : '';
        return { ok: true, msg: 'Das ist inhaltlich gut. Du hast die wichtigen Punkte genannt.' + more + ' Vergleiche mit der Musterlösung.', sample: true };
      }
      return { ok: false, msg: (t.need < t.groups.length ? 'Da fehlt noch etwas. Nenne mindestens ' + t.need + ' dieser Punkte: ' : 'Da fehlt noch etwas. Ich vermisse: ') + miss.map(function (g) { return esc(g.label); }).join('; ') + '. Ergänze das und prüfe noch einmal.' };
    },
    solution: function () { return '<p><b>Musterlösung:</b> ' + esc(t.sample) + '</p>'; },
    after: function () { var l = card.querySelector('.loesung'); l.innerHTML = '<p><b>Zum Vergleichen, Musterlösung:</b> ' + esc(t.sample) + '</p>'; l.classList.add('show'); }
  };
};

/* --- Bildaufgabe: Bildteile finden --- */
W_TYPES.spots = function (t, card, body) {
  body.innerHTML = figure(); var box = body.querySelector('.spotbox'), queue = shuffle(t.spots), idx = 0, errs = 0, ended = false;
  var prompt = mk('div', 'spotq'); body.insertBefore(prompt, body.firstChild);
  function ask() { prompt.textContent = idx < queue.length ? 'Tippe auf: ' + queue[idx][0] + ' (' + (idx + 1) + ' von ' + queue.length + ')' : 'Alle Bildteile gefunden.'; }
  ask();
  function ping(x, y, ok) { var p = mk('div', 'ping ' + (ok ? 'ok' : 'no')); p.style.left = x + 'px'; p.style.top = y + 'px'; box.appendChild(p); setTimeout(function () { if (p.parentNode) p.parentNode.removeChild(p); }, 900); }
  box.addEventListener('click', function (e) {
    if (ended || idx >= queue.length) return;
    var r = box.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top, x = px / r.width * 100, y = py / r.height * 100, s = queue[idx][1];
    var inside = x >= s[0] && x <= s[2] && y >= s[1] && y <= s[3];
    ping(px, py, inside);
    if (inside) {
      var rc = mk('div', 'rect'); rc.style.cssText = 'left:' + s[0] + '%;top:' + s[1] + '%;width:' + (s[2] - s[0]) + '%;height:' + (s[3] - s[1]) + '%'; box.appendChild(rc);
      idx++; ask();
      if (idx >= queue.length) { ended = true; outcome(t, card, true, errs ? 'Alle Bildteile gefunden. Du hast ' + errs + ' Mal danebengetippt, schau beim nächsten Mal genauer hin.' : 'Alle Bildteile beim ersten Versuch gefunden. Genau so beschreibt man ein Bild: gründlich.'); }
      else { var b = B(); if (b) b.richtig(t.id + '-' + idx); }
    } else {
      errs++; S.tries[t.id] = errs; var b2 = B(); if (b2) b2.falsch(t.id);
      setFb(card, 'no', nm('Dort ist nicht das, was ich meine. Suche: <b>' + esc(queue[idx][0]) + '</b>.')); if (errs >= 3) card.querySelector('.showsol').style.display = '';
    }
  });
  return {
    auto: true, check: function () { return null; },
    solution: function () { return '<p>Die gesuchten Bildteile sind jetzt grün umrandet.</p>'; },
    reveal: function () { ended = true; queue.forEach(function (q) { var s = q[1], rc = mk('div', 'rect'); rc.style.cssText = 'left:' + s[0] + '%;top:' + s[1] + '%;width:' + (s[2] - s[0]) + '%;height:' + (s[3] - s[1]) + '%'; box.appendChild(rc); }); if (!S.done[t.id]) { S.done[t.id] = 'help'; card.classList.add('done'); tabs(); } }
  };
};
(function () { var f = W_TYPES.free; W_TYPES.free = function (t, card, body) { var w = f(t, card, body), c = w.check; w.check = function () { var r = c(); if (r && r.ok) setTimeout(w.after, 0); return r; }; return w; }; })();

/* ================= SKK-Probe ================= */
var P = null;
function buildProbe() {
  var mc = PROBE.map(function (p) { return { kind: 'mc', ch: p.ch, q: p.q, o: p.o, why: p.why }; });
  CH.forEach(function (c) { c.tasks.forEach(function (t) { if (t.type === 'mc') mc.push({ kind: 'mc', ch: c.id, q: plain(t.q), o: t.o, why: t.why }); }); });
  var tf = PROBE_TF.map(function (p) { return { kind: 'tf', ch: p.ch, q: p.s, v: p.v, why: p.why }; });
  function pick(pool, n) { var by = {}; shuffle(pool).forEach(function (q) { (by[q.ch] = by[q.ch] || []).push(q); }); var out = [], ids = shuffle(Object.keys(by)); while (out.length < n && ids.length) { ids.forEach(function (k) { if (out.length < n && by[k].length) out.push(by[k].shift()); }); ids = ids.filter(function (k) { return by[k].length; }); } return out; }
  var qs = shuffle(pick(mc, 8).concat(pick(tf, 4)));
  P = { qs: qs, i: 0, ok: 0, wrong: {}, answered: false };
}
function renderProbe(v) {
  if (!P) buildProbe();
  v.appendChild(mk('h2', null, '📝 SKK-Probe'));
  v.appendChild(mk('p', 'sub', 'Zwölf gemischte Fragen aus allen Kapiteln. Lies in Ruhe. Zurückgehen ist wie in der SKK nicht möglich.'));
  if (P.i >= P.qs.length) return renderProbeEnd(v);
  var q = P.qs[P.i], card = mk('div', 'card task'), done = false;
  card.innerHTML = '<div class="pq">Frage ' + (P.i + 1) + ' von ' + P.qs.length + '</div><div class="q">' + (q.kind === 'tf' ? 'Wahr oder falsch? <br><i>' + esc(q.q) + '</i>' : esc(q.q)) + '</div><div class="body"></div><div class="fb" role="status"></div><div class="row"></div>';
  var body = card.querySelector('.body'), row = card.querySelector('.row'), opts = q.kind === 'tf' ? [{ x: 'Stimmt', ok: q.v }, { x: 'Stimmt nicht', ok: !q.v }] : shuffle(q.o.map(function (x, i) { return { x: x, ok: i === 0 }; })), box = mk('div', 'opts');
  opts.forEach(function (o) {
    var b = mk('button', 'opt', esc(o.x));
    b.onclick = function () {
      if (done) return; done = true; var b2 = B();
      opts.forEach(function (p) { p.el.disabled = true; if (p.ok) p.el.classList.add('good'); });
      if (o.ok) { P.ok++; b.classList.add('good'); setFb(card, 'ok', nm('✓ ' + esc(q.why))); if (b2) b2.richtig('probe' + P.i); }
      else { b.classList.remove('good'); b.classList.add('bad'); P.wrong[q.ch] = (P.wrong[q.ch] || 0) + 1; setFb(card, 'no', nm('Nicht ganz. ' + esc(q.why))); if (b2) b2.falsch('probe' + P.i); }
      var n = mk('button', 'btn', P.i + 1 < P.qs.length ? 'Nächste Frage →' : 'Ergebnis ansehen →'); n.onclick = function () { P.i++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }; row.appendChild(n);
    };
    o.el = b; box.appendChild(b);
  });
  body.appendChild(box); v.appendChild(card);
}
function renderProbeEnd(v) {
  var n = P.qs.length, ok = P.ok, wrong = Object.keys(P.wrong).sort(function (a, b) { return P.wrong[b] - P.wrong[a]; });
  var msg = ok >= 11 ? 'Sehr stark. Du bist gut vorbereitet. Lies vor der SKK noch einmal die Merkkästen durch.' : ok >= 8 ? 'Das ist solide. Mit etwas Wiederholung sitzt es.' : ok >= 5 ? 'Da ist noch Luft nach oben. Das ist in Ordnung, dafür übst du ja.' : 'Das war noch nicht so gut. Keine Sorge: Arbeite die Kapitel mit den Merkkästen noch einmal durch und versuche es dann erneut.';
  var c = mk('div', 'card', '<div class="big">' + ok + ' von ' + n + ' richtig</div><p class="hello" style="background:none;border:0;padding:0"><b class="nm" style="color:var(--board)">Herr Neumann:</b>&nbsp;' + msg + '</p>');
  if (wrong.length) {
    c.appendChild(mk('p', null, '<b>Hier lohnt sich eine Wiederholung:</b>')); var ul = mk('ul', 'res');
    wrong.forEach(function (id) { var li = mk('li', null, esc(CHI[id].title) + ' (' + P.wrong[id] + (P.wrong[id] === 1 ? ' Fehler' : ' Fehler') + ') '), b = mk('button', 'btn sec', 'Zum Kapitel'); b.style.padding = '5px 12px'; b.style.fontSize = '14px'; b.onclick = function () { go(id); }; li.appendChild(b); ul.appendChild(li); });
    c.appendChild(ul);
  } else c.appendChild(mk('p', null, 'Kein einziger Fehler. Du kannst dich jetzt guten Gewissens auf die SKK verlassen.'));
  var row = mk('div', 'row'), r = mk('button', 'btn', 'Neue Runde mit anderen Fragen'); r.onclick = function () { P = null; render(); window.scrollTo({ top: 0 }); }; row.appendChild(r); c.appendChild(row);
  v.appendChild(c);
  if (B() && !P.said) { P.said = 1; setTimeout(function () { nsay('<p class="kb-text"><b>' + ok + ' von ' + n + ' richtig.</b> ' + esc(msg) + '</p>', ok >= 8 ? 'proud' : 'caring', 0); }, 600); }
}

/* ================= Start ================= */
function startAll() {
  BILD = document.getElementById('bild-src').innerHTML;
  tabs(); render(); updateStars();
  if (window.Begleiter && window.Kolbi) {
    Begleiter.init({ mode: 'lernen', offsetBottom: 56, aufgabe: 'Wähle ein Kapitel. Jedes hat einen Merkkasten und Aufgaben. Am Ende kannst du dich in der SKK-Probe testen.', hilfe: 'Beginne mit Kapitel 1 oder mit dem Thema, bei dem du dich unsicher fühlst.', tipps: [] });
  }
}
document.addEventListener('DOMContentLoaded', startAll);
